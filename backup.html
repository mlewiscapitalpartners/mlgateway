  :root { --navy: #071224; --yellow: #F5B722; --light: #F0F4F8; }

  #root { overflow-x: hidden; width: 100%; min-width: 0; }
  *, *::before, *::after { box-sizing: border-box; min-width: 0; }
  h1, h2, h3, h4, h5, h6, p, span, a, li, div { overflow-wrap: break-word; word-wrap: break-word; }
  button, a { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

  .serif { font-family: 'Playfair Display', Georgia, serif; }

  input:focus, select:focus, textarea:focus { outline: none; }
  .fadein { animation: fadein .5s cubic-bezier(.22,.61,.36,1) both; }
  @keyframes fadein { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .fadein-s { animation: fadein .3s ease both; }
  .slide-up { animation: slideUp .45s ease both; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
  .pulse-soft { animation: pulseSoft 2s infinite ease-in-out; }
  @keyframes pulseSoft { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
  .bar-grow { animation: barGrow 1s cubic-bezier(.22,.61,.36,1) both; }
  @keyframes barGrow { from { width: 0 !important; } }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--navy); }
  ::-webkit-scrollbar-thumb { background: var(--yellow); border-radius: 4px; }
  .glow { box-shadow: 0 0 20px rgba(245, 183, 34, 0.15); }
  .modal-fade { animation: modalFade .25s ease both; }
  @keyframes modalFade { from { opacity: 0; } to { opacity: 1; } }
  .modal-card { animation: modalCard .35s cubic-bezier(.22,.61,.36,1) both; }
  @keyframes modalCard { from { opacity: 0; transform: translateY(30px) scale(.98); } to { opacity: 1; transform: none; } }
  .doc-line { height: 6px; background: rgba(7,18,36,0.08); border-radius: 3px; }
  .clause-num { font-variant-numeric: tabular-nums; }
  .paper { box-shadow: 0 10px 40px -10px rgba(7,18,36,0.15), 0 2px 8px rgba(7,18,36,0.04); }
  @media (max-width: 768px) {
    .fadein, .fadein-s, .slide-up { animation: none !important; opacity: 1 !important; transform: none !important; }
    .pulse-soft { animation: none !important; opacity: 1 !important; }
    .bar-grow { animation-duration: 0.4s !important; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
  }
  @media (min-width: 1024px) { html { scroll-behavior: smooth; } }

  /* ── WhatsApp deep-link helpers ────────────────────────────────
   On mobile, `wa.me` serves an interstitial "Open app" page.
   The `whatsapp://` scheme bypasses it and launches the app
   directly with the message pre-filled.                          */
function isMobileDevice() {
  if (typeof navigator === 'undefined') return false;
  const ua = (navigator.userAgent || navigator.vendor || '').toLowerCase();
  return /android|iphone|ipad|ipod|blackberry|iemobile|opera mini|mobile/i.test(ua);
}

function buildWhatsappUrl(message, phone) {
  const p = phone || ADMIN_WHATSAPP;
  const encoded = encodeURIComponent(message);
  if (isMobileDevice()) {
    // Native app scheme — opens WhatsApp directly on the phone
    return 'whatsapp://send?phone=' + p + '&text=' + encoded;
  }
  // Desktop — opens WhatsApp Web / Desktop
  return 'https://wa.me/' + p + '?text=' + encoded;
}

/* Launch WhatsApp. On mobile, uses a programmatic anchor click
   on a `whatsapp://` link (the only reliable way to fire a custom
   URL scheme from JavaScript). On desktop, returns a placeholder
   window that the caller navigates once the URL is ready. */
function launchWhatsapp(message, phone) {
  const url = buildWhatsappUrl(message, phone);
  if (isMobileDevice()) {
    try {
      const a = document.createElement('a');
      a.href = url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      return { opened: true, url, placeholder: null };
    } catch (e) {
      console.warn('[MLG] Mobile deep-link click failed:', e);
      return { opened: false, url, placeholder: null };
    }
  }
  let placeholder = null;
  try {
    placeholder = window.open('about:blank', '_blank');

    }
  } catch (e) {
    console.warn('[MLG] Placeholder window blocked:', e);
  }
  return { opened: false, url, placeholder };
}

function numberToWords(num){
  const ones = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const tens = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  if(num === 0) return 'Zero';
  function chunk(n){
    if(n < 20) return ones[n];
    if(n < 100) return tens[Math.floor(n/10)] + (n%10 ? ' ' + ones[n%10] : '');
    if(n < 1000) return ones[Math.floor(n/100)] + ' Hundred' + (n%100 ? ' ' + chunk(n%100) : '');
    if(n < 1000000) return chunk(Math.floor(n/1000)) + ' Thousand' + (n%1000 ? ' ' + chunk(n%1000) : '');
    return chunk(Math.floor(n/1000000)) + ' Million' + (n%1000000 ? ' ' + chunk(n%1000000) : '');
  }
  return chunk(num);
}
function amountInWords(amountStr, currency){
  const num = parseFloat(String(amountStr).replace(/[^\d.]/g, '')) || 0;
  const words = numberToWords(Math.round(num));
  if (currency === 'USD') return 'US Dollars ' + words + ' Only';
  return words + ' Kwacha Only';
}

async function generateReceiptNumber(prefix){
  const year = new Date().getFullYear();
  const pfx = prefix || 'MLG';
  const fb = await firebaseReady;
  if (fb) {
    try {
      const counterRef = FB.doc(fbDb, 'counters', 'receipts_' + pfx + '_' + year);
      const result = await FB.runTransaction(fbDb, async (tx) => {
        const snap = await tx.get(counterRef);
        const next = (snap.exists() && snap.data().value ? snap.data().value : 0) + 1;
        tx.set(counterRef, { value: next, updatedAt: FB.serverTimestamp() }, { merge: true });
        return next;
      });
      return pfx + '-' + year + '-' + String(result).padStart(5, '0');
    } catch(e) { console.warn('[MLG] Receipt counter failed:', e); }
  }
  return pfx + '-' + year + '-' + String(Math.floor(Math.random() * 90000) + 10000);
}

function sanitizeForFirestore(obj){
  const out = {};
  Object.entries(obj).forEach(([k, v]) => {
    if (v === undefined || v === null) return;
    if (typeof v === 'string' && v.trim() === '') return;
    if (Array.isArray(v) && v.length === 0) return;
    out[k] = v;
  });
  return out;
}

  const revNum = parseFloat(String(f.revenue || '').replace(/[^0-9.]/g, '')) || 0;
  let revPts = 0;
  if (revNum >= 5000000) revPts = 8; else if (revNum >= 1000000) revPts = 7; else if (revNum >= 500000) revPts = 5; else if (revNum >= 250000) revPts = 3; else if (revNum >= 100000) revPts = 1;
  p2 += revPts;
  if (revPts >= 7) positives.push('Substantial revenue base');
  else if (revPts === 0) flags.push('Limited or no revenue base');
  const trajMap = { 'Growing >20% YoY': 5, 'Growing 5–20% YoY': 4, 'Stable': 2, 'Declining': 0 };
  const trajPts = trajMap[f.revenueTrajectory] ?? 0;
  p2 += trajPts;
  if (f.revenueTrajectory === 'Declining') flags.push('Declining revenue trajectory');
  const ebitdaMap = { 'Profitable & growing': 6, 'Profitable & stable': 5, 'Break-even': 3, 'Loss-making, improving': 2, 'Loss-making, widening': 0 };
  const ebitdaPts = ebitdaMap[f.ebitdaPosition] ?? 0;
  p2 += ebitdaPts;
  if (ebitdaPts >= 5) positives.push('Demonstrated profitability');
  if (ebitdaPts === 0 && revNum < 500000) critical.push('Loss-making with widening losses at low revenue');
  const finMap = { 'Audited': 4, 'Independently reviewed': 3, 'Management accounts only': 1, 'None available': 0 };
  const finPts = finMap[f.financialStatements] ?? 0;
  p2 += finPts;
  if (finPts === 0) conditions.push('Provide management accounts for the last 12 months');
  else if (finPts >= 3) positives.push('Financial statements independently verified');
  const recMap = { '3 years or more': 2, '2 – 3 years': 2, '1 – 2 years': 1, 'Less than 1 year': 0 };
  p2 += recMap[f.financialHistory] ?? 0;
  dims.push({ name: 'Financial Substance', points: p2, max: 25 });

  let p3 = 0;
  const uofMap = { 'Yes — fully detailed with allocation': 8, 'Yes — outline available': 5, 'Partially defined': 2, 'Not yet defined': 0 };
  const uofPts = uofMap[f.useOfFunds] ?? 0;
  p3 += uofPts;
  if (uofPts === 0) critical.push('Use of funds not defined');
  else if (uofPts >= 5) positives.push('Documented use of funds');
  const capMap = { 'Fully documented and current': 5, 'Mostly documented': 3, 'Informal records': 1, 'Not documented': 0 };
  const capPts = capMap[f.capTable] ?? 0;
  p3 += capPts;
  if (capPts === 0) conditions.push('Prepare a clear, documented cap table before introduction');
  else if (capPts >= 4) positives.push('Clean, documented capital structure');
  const invMap = { 'Founder-owned, no external investors': 4, 'Existing investors aligned and supportive': 4, 'Existing investors passive': 3, 'Complex or misaligned shareholder base': 1 };
  p3 += invMap[f.existingInvestors] ?? 0;
  const tlMap = { 'Within 3 months': 3, '3 – 6 months': 3, '6 – 12 months': 2, '12 months +': 1, 'Flexible': 2 };
  p3 += tlMap[f.timeline] ?? 0;
  dims.push({ name: 'Capital Raise Readiness', points: p3, max: 20 });

  let p4 = 0;
  const boardMap = { 'Formal board with independent directors': 5, 'Formal board': 4, 'Advisory board only': 2, 'No formal governance': 0 };
  const boardPts = boardMap[f.governance] ?? 0;
  p4 += boardPts;
  if (boardPts === 0) conditions.push('Establish a formal board or advisory structure');
  else if (boardPts >= 4) positives.push('Formal governance structure');
  const shaMap = { 'Signed and current': 4, 'Signed, needs review': 2, 'Informal arrangement': 1, 'None': 0 };
  p4 += shaMap[f.shareholderAgreement] ?? 0;
  const amlMap = { 'Full KYC / AML pack ready': 3, 'Partial documentation': 2, 'Not prepared': 0 };
  const amlPts = amlMap[f.amlReadiness] ?? 0;
  p4 += amlPts;
  if (amlPts === 0) conditions.push('Prepare KYC / AML documentation');
  p4 += 3;
  dims.push({ name: 'Governance & Compliance', points: p4, max: 15 });

  let p5 = 0;
  const deckMap = { 'Detailed, current and investor-ready': 5, 'Outline available': 3, 'Draft in progress': 1, 'None': 0 };
  const deckPts = deckMap[f.pitchDeck] ?? 0;
  p5 += deckPts;
  if (deckPts === 0) conditions.push('Prepare a detailed information memorandum or pitch deck');
  else if (deckPts >= 5) positives.push('Investor-ready materials prepared');
  const modelMap = { 'Full 3-statement financial model': 6, 'Forecast model': 4, 'Simple projections': 2, 'None': 0 };
  const modelPts = modelMap[f.financialModel] ?? 0;
  p5 += modelPts;
  if (modelPts === 0) conditions.push('Build a financial model with scenario analysis');
  const ddMap = { 'Full data room prepared': 5, 'Partial due diligence pack': 3, 'Not prepared': 0 };
  const ddPts = ddMap[f.ddPack] ?? 0;
  p5 += ddPts;
  if (ddPts === 0) conditions.push('Prepare a due diligence data room');
  const mgmtMap = { 'Experienced and complete': 5, 'Experienced with identified gaps': 3, 'Founder-led only': 2, 'Key roles unfilled': 0 };
  const mgmtPts = mgmtMap[f.managementTeam] ?? 0;
  p5 += mgmtPts;
  if (mgmtPts >= 5) positives.push('Experienced management team');
  else if (mgmtPts === 0) conditions.push('Fill key management roles before institutional engagement');
  const kpMap = { 'Low — strong bench': 4, 'Moderate': 2, 'High — single key person': 0 };
  const kpPts = kpMap[f.keyPersonRisk] ?? 0;
  p5 += kpPts;
  if (kpPts === 0) flags.push('High key person concentration risk');
  dims.push({ name: 'Investment Readiness', points: p5, max: 25 });

  const total = p1 + p2 + p3 + p4 + p5;
  const pct = Math.round((total / 100) * 100);

  let decision, tier, tierLabel;
  if (critical.length > 0) { decision = 'decline'; tier = 'declined'; tierLabel = 'Not Yet Investment-Ready'; }
  else if (total >= 78) { decision = 'approve'; tier = total >= 88 ? 'investment-grade' : 'investment-ready'; tierLabel = total >= 88 ? 'Investment-Grade' : 'Investment-Ready'; }
  else if (total >= 58) { decision = 'conditional'; tier = 'growth-ready'; tierLabel = 'Growth-Ready — Conditions Apply'; }
  else { decision = 'decline'; tier = 'declined'; tierLabel = 'Not Yet Investment-Ready'; }

  const uniqueConditions = decision === 'approve' ? [] : [...new Set(conditions)];
  return { decision, tier, tierLabel, total, maxTotal: 100, pct, dims, critical, positives, conditions: uniqueConditions, flags };
}

function computeComplexity(formData, assessment) {
  const factors = [];
  const amountMap = { 'Under $1m': 4, '$1m – $5m': 9, '$5m – $10m': 14, '$10m – $25m': 19, '$25m – $50m': 22, '$50m+': 25 };
  const amountVal = formData.amount || '';
  factors.push({ key: 'Capital quantum', value: amountVal || 'Not stated', contribution: amountMap[amountVal] ?? 8, max: 25, note: 'Larger raises require proportionally more positioning and matching effort.' });
  const typeMap = { 'Equity': 7, 'Growth capital': 10, 'Strategic capital': 14, 'Acquisition capital': 17, 'Project & infrastructure capital': 20, 'Other': 15 };
  const typeVal = formData.capitalType || '';
  factors.push({ key: 'Venture structure', value: typeVal || 'Not stated', contribution: typeMap[typeVal] ?? 10, max: 20, note: 'Acquisition, project and structured raises involve more complex engagement.' });
  const conditionsCount = (assessment.conditions || []).length;
  const condContrib = Math.min(conditionsCount * 5, 20);
  factors.push({ key: 'Intervention required', value: conditionsCount === 0 ? 'None identified' : `${conditionsCount} condition${conditionsCount === 1 ? '' : 's'} to resolve`, contribution: condContrib, max: 20, note: 'Each condition adds intervention work to bring the opportunity to investor-ready standard.' });
  let govGaps = 0;
  if (formData.governance === 'No formal governance') govGaps += 5; else if (formData.governance === 'Advisory board only') govGaps += 3;
  if (formData.shareholderAgreement === 'None') govGaps += 4; else if (formData.shareholderAgreement === 'Informal arrangement') govGaps += 2;
  if (formData.amlReadiness === 'Not prepared') govGaps += 3; if (formData.amlReadiness === 'Partial documentation') govGaps += 1.5;
  if (formData.financialStatements === 'None available') govGaps += 3; else if (formData.financialStatements === 'Management accounts only') govGaps += 1.5;
  govGaps = Math.min(Math.round(govGaps), 15);
  const govLabel = govGaps >= 10 ? 'Material gaps' : govGaps >= 5 ? 'Moderate gaps' : govGaps > 0 ? 'Minor gaps' : 'Compliant';
  factors.push({ key: 'Governance & compliance', value: govLabel, contribution: govGaps, max: 15, note: 'Gaps in governance, shareholder documentation or AML readiness require additional engagement work.' });
  let mgmtContrib = 0, mgmtLabel = 'Not stated';
  if (formData.managementTeam === 'Key roles unfilled') { mgmtContrib = 10; mgmtLabel = 'Key roles unfilled'; }
  else if (formData.managementTeam === 'Founder-led only') { mgmtContrib = 6; mgmtLabel = 'Founder-led only'; }
  else if (formData.managementTeam === 'Experienced with identified gaps') { mgmtContrib = 3; mgmtLabel = 'Experienced with gaps'; }
  else if (formData.managementTeam === 'Experienced and complete') { mgmtContrib = 0; mgmtLabel = 'Experienced and complete'; }
  factors.push({ key: 'Management readiness', value: mgmtLabel, contribution: mgmtContrib, max: 10, note: 'Management gaps increase the positioning and support effort required.' });
  const tlMap = { 'Within 3 months': 10, '3 – 6 months': 7, '6 – 12 months': 4, '12 months +': 1, 'Flexible': 2 };
  const tlVal = formData.timeline || '';
  factors.push({ key: 'Timeline urgency', value: tlVal || 'Not stated', contribution: tlMap[tlVal] ?? 3, max: 10, note: 'Compressed timelines require priority allocation and intensified matching.' });
  const score = Math.min(Math.round(factors.reduce((a, f) => a + f.contribution, 0)), 100);
  return { score, factors };
}

function computeEngagementFee(formData, assessment) {
  const geoKey = getGeographyBand(formData.country);
  const band = GEO_BANDS[geoKey];
  const complexity = computeComplexity(formData, assessment);
  const raw = band.min + (band.max - band.min) * (complexity.score / 100);
  const fee = Math.round(raw / 100) * 100;
  const clamped = Math.max(band.min, Math.min(band.max, fee));
  return { fee: clamped, band, geoKey, complexity: complexity.score, factors: complexity.factors };
}

function ChipGroup({ options, value, onChange, multi = false, columns = 2 }) {
  const isOn = (o) => multi ? (value || []).includes(o) : value === o;
  const toggle = (o) => {
    if (multi) {
      const v = value || [];
      onChange(v.includes(o) ? v.filter(x => x !== o) : [...v, o]);
    } else onChange(o);
  };
  const cols = { 1: 'grid-cols-1', 2: 'grid-cols-1 sm:grid-cols-2', 3: 'grid-cols-1 sm:grid-cols-3' };
  return (
    <div className={`grid ${cols[columns]} gap-2.5`}>
      {options.map(o => {
        const label = typeof o === 'string' ? o : o.v;
        const desc = typeof o === 'string' ? null : o.d;
        const on = isOn(label);
        return (
          <button key={label} type="button" onClick={() => toggle(label)}
            className={`text-left px-4 py-3.5 rounded-sm border transition-all duration-200 ${
              on ? 'border-[#F5B722] bg-[#F5B722]/10 shadow-[0_0_15px_rgba(245,183,34,0.1)]' : 'border-[#071224]/12 bg-white hover:border-[#F5B722]/50 hover:bg-[#F5B722]/5'

              </span>

        );
      })}
    </div>
  );

          Scan the code, or visit the URL below, to check this receipt's status. Verification is completed by the ML Gateway team after the payment is confirmed.
          <code>{VERIFY_BASE_URL}/{data.receiptNo || '…'}</code>
        </div>
      </div>
      <div className="nr-footer">
        <div className="nr-footer-note" style={{ fontStyle: 'italic', marginBottom: 8, lineHeight: 1.5 }}>
          <strong>This is a PROVISIONAL receipt.</strong> It acknowledges the applicant's submission of payment details to ML Gateway. A final receipt will be issued once the payment has been verified against our records. Subject to actual receipt of funds into the nominated account; ML Gateway reserves the right to withdraw or amend this receipt in the event of a discrepancy.
        </div>
        <div className="nr-signature">
          <div className="nr-sig-block"><div className="nr-sig-line"></div><div className="nr-sig-lbl">Authorised Signature</div></div>
          <div className="nr-sig-block"><div className="nr-sig-line"></div><div className="nr-sig-lbl">Date</div></div>
        </div>
        <div style={{ marginTop: 14, fontSize: 10.5, color: '#333' }}><strong>ML Gateway · M. Lewis Group</strong><br/>Lusaka, Zambia · engagements@mlgateway.com · +260 768 526 191</div>
      </div>
    </div>
  );
}

/* ============================================================
   PAYMENT FLOW COMPONENT
   ============================================================ */
function PaymentFlow({ amount, currency, purpose, purposeDetail, applicant, receiptPrefix, onConfirmed, onClose }) {
  const [method, setMethod] = useState(null);
  const [senderName, setSenderName] = useState('');
  const [senderContact, setSenderContact] = useState('');
  const [userRef, setUserRef] = useState('');
  const [agree, setAgree] = useState(false);
  const [errorMsg, setErrorMsg] = useState('');
  const [confirmed, setConfirmed] = useState(false);
  const [receiptNo, setReceiptNo] = useState('');
  const [receiptDate, setReceiptDate] = useState('');
  const [whatsappUrl, setWhatsappUrl] = useState('');
  const [whatsappSent, setWhatsappSent] = useState(false);
  const [copied, setCopied] = useState('');
  const [generatingPDF, setGeneratingPDF] = useState(false);
  const [checkRef, setCheckRef] = useState('');
  const [checkResult, setCheckResult] = useState('');
  const [cloudSaved, setCloudSaved] = useState(null);
  const [copiedMessage, setCopiedMessage] = useState(false);
  const [whatsappOpened, setWhatsappOpened] = useState(false);

  const copyText = (text, key) => {
    const done = () => { setCopied(key); setTimeout(() => setCopied(''), 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
    else fallbackCopy(text, done);
  };
  const fallbackCopy = (text, done) => { const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch(e) {} document.body.removeChild(ta); };

  const buildWhatsappMessage = (rcpt, dateOverride) => {
    const dateStr = dateOverride || receiptDate;
    const lines = [
      '*ML GATEWAY — PAYMENT PROOF*', '',
      '*Receipt No:* ' + rcpt,
      '*Date & Time:* ' + dateStr,
      '', '*APPLICANT / BUSINESS*',
      'Name: ' + (applicant.firstName || '') + ' ' + (applicant.lastName || ''),
      'Company: ' + (applicant.company || '—'),
      'Email: ' + (applicant.email || '—'),
      'Country: ' + (applicant.country || '—'),
      '', '*PURPOSE*', purpose, '',
      '*PAYMENT DETAILS*',
      'Method: ' + (PAYMENT_METHODS[method] ? PAYMENT_METHODS[method].label : '—'),
      'Amount: ' + amount,
      'Sender Name: ' + senderName,
      'Sender Contact: ' + senderContact,
      'Transaction ID / Ref: ' + (userRef || '(not provided)'),
      '', '_Please verify this payment against our records and confirm receipt. A provisional receipt has been auto-generated for the applicant._'
    ];
    return lines.join('\n');
  };

    const handleConfirm = async () => {
    setErrorMsg('');
    if (!method) { setErrorMsg('Please select a payment method first.'); return; }
    if (!senderName.trim()) { setErrorMsg('Please enter the name on the payment.'); return; }
    if (!senderContact.trim()) { setErrorMsg('Please enter the phone or email used to pay.'); return; }
    if (!userRef.trim()) { setErrorMsg('Please enter your transaction reference.'); return; }
    if (!agree) { setErrorMsg('Please tick the confirmation checkbox.'); return; }

    // ── Open a placeholder tab SYNCHRONOUSLY while the user gesture is
    //    still active. Used only on desktop — on mobile we deep-link.
    let waWindow = null;
    if (!isMobileDevice()) {
      try {
        waWindow = window.open('about:blank', '_blank');
        if (waWindow) {
          try {
            waWindow.document.write('<title>Opening WhatsApp…</title><body style="font-family:system-ui;padding:24px;color:#071224">Opening WhatsApp…</body>');
          } catch (e) {}
        }
      } catch (e) {
        console.warn('[MLG] Placeholder window blocked:', e);
      }
    }

    const rcpt = await generateReceiptNumber(receiptPrefix || 'MLG');
    const now = new Date();
    const dt = now.toLocaleString('en-GB', { year:'numeric', month:'short', day:'2-digit', hour:'2-digit', minute:'2-digit' });
    setReceiptNo(rcpt); setReceiptDate(dt);

    const msg = buildWhatsappMessage(rcpt, dt);

    // ── Mobile: deep-link directly into the WhatsApp app.
    //    Desktop: navigate the placeholder tab to WhatsApp Web.
    if (isMobileDevice()) {
      const result = launchWhatsapp(msg);
      setWhatsappUrl(result.url);
      setWhatsappOpened(result.opened);
      if (!result.opened) {
        console.warn('[MLG] Mobile deep-link did not fire — user will use the green button.');
      }
    } else {
      const url = buildWhatsappUrl(msg);
      setWhatsappUrl(url);
      if (waWindow && !waWindow.closed) {
        try {
          waWindow.location.href = url;
          setWhatsappOpened(true);
        } catch (e) {
          console.warn('[MLG] Could not navigate placeholder window:', e);
        }
      } else {
        console.warn('[MLG] WhatsApp auto-open was blocked — user will use the visible green button.');
      }
    }

    setConfirmed(true);

    const m = PAYMENT_METHODS[method];

    const rawData = {
      receiptNo: rcpt,
      receiptDate: dt,
      amount: amount,
      currency: currency,
      purpose: purpose,
      method: m.label,
      transactionRef: userRef,
      senderName: senderName,
      senderContact: senderContact,
      applicantName: ((applicant.firstName || '') + ' ' + (applicant.lastName || '')).trim(),
      applicantEmail: applicant.email,
      applicantCountry: applicant.country,
      applicantCompany: applicant.company,
      recipientAccount: m.recipientAccount,
      status: 'pending',
      source: receiptPrefix || 'MLG'
    };
    const cleanData = sanitizeForFirestore(rawData);

    const fb = await firebaseReady;
    if (fb) {
      try {
        await FB.setDoc(
          FB.doc(fbDb, 'receipts', rcpt),
          { ...cleanData, createdAt: FB.serverTimestamp() },
          { merge: true }
        );
        console.log('[MLG] ✅ Receipt saved to Firestore:', rcpt, cleanData);
        setCloudSaved('ok');
      } catch (e) {
        console.error('[MLG] ❌ Receipt write FAILED:', e && e.code, e && e.message, e);
        setCloudSaved('fail');
        setErrorMsg('Receipt saved locally. Cloud sync failed (' + ((e && e.code) || (e && e.message) || 'unknown') + '). Please send proof to WhatsApp.');
      }
    } else {
      console.warn('[MLG] Firebase not ready — receipt saved locally only.');
      setCloudSaved('fail');
    }

    if (onConfirmed) onConfirmed(cleanData);
  };
  const copyWhatsappMessage = () => {
    const text = buildWhatsappMessage(receiptNo, receiptDate);
    const done = () => { setCopiedMessage(true); setTimeout(() => setCopiedMessage(false), 2500); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopyMessage(text, done));
    } else {
      fallbackCopyMessage(text, done);
    }
  };

  const fallbackCopyMessage = (text, done) => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); } catch (e) {}
    document.body.removeChild(ta);
  };

  const downloadReceiptPDF = async () => {
    const el = document.getElementById('mlgReceipt');
    if (!el) return;
    if (typeof html2canvas === 'undefined' || typeof window.jspdf === 'undefined') { setErrorMsg('PDF generator not ready. Use Print instead.'); return; }
    setGeneratingPDF(true);
    try {
      const canvas = await html2canvas(el, { scale: 2, backgroundColor: '#ffffff', useCORS: true, logging: false });
      const imgData = canvas.toDataURL('image/png');
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ unit:'mm', format:'a4', orientation:'portrait' });
      const pdfW = pdf.internal.pageSize.getWidth();
      const pdfH = pdf.internal.pageSize.getHeight();
      const margin = 10; const usableW = pdfW - margin * 2;
      const ratio = canvas.height / canvas.width;
      let dispW = usableW; let dispH = dispW * ratio;
      if (dispH > pdfH - margin * 2) { dispH = pdfH - margin * 2; dispW = dispH / ratio; }
      const xOffset = (pdfW - dispW) / 2;
      pdf.addImage(imgData, 'PNG', xOffset, margin, dispW, dispH);
      pdf.save('MLG-Receipt-' + receiptNo + '.pdf');
    } catch(err) { console.error(err); setErrorMsg('Could not generate PDF. Try Print instead.'); }
    finally { setGeneratingPDF(false); }
  };

  const printReceipt = () => {
    document.body.classList.add('print-receipt-mode');
    setTimeout(() => { window.print(); setTimeout(() => document.body.classList.remove('print-receipt-mode'), 200); }, 100);
  };

  const lookupReceipt = async () => {
    if (!checkRef.trim()) { setCheckResult('Please enter a receipt number.'); return; }
    setCheckResult('Checking…');
    const fb = await firebaseReady;
    if (!fb) { setCheckResult('Verification service is not yet online. Contact engagements@mlgateway.com with your receipt number.'); return; }
    try {
      const snap = await FB.getDoc(FB.doc(fbDb, 'receipts', checkRef.trim().toUpperCase()));
      if (!snap.exists()) { setCheckResult('Receipt not found. Check the number, or contact engagements@mlgateway.com.'); return; }
      const data = snap.data();
      const status = (data.status || 'pending').toLowerCase();
      setCheckResult(status === 'verified' ? 'VERIFIED — your payment has been confirmed.' : 'PENDING — awaiting verification by our team.');
    } catch(e) { setCheckResult('Could not check right now. Please try again later.'); }
  };

  if (confirmed) {
    const receiptData = { receiptNo, receiptDate, amount, currency, purpose, method: PAYMENT_METHODS[method].label, transactionRef: userRef, senderName, senderContact, applicantName: ((applicant.firstName || '') + ' ' + (applicant.lastName || '')).trim(), applicantEmail: applicant.email, applicantCountry: applicant.country, recipientAccount: PAYMENT_METHODS[method].recipientAccount };
    return (
      <div className="fadein">
        <div className="payment-success">
          <i className="fas fa-check-circle ps-icon" aria-hidden="true"></i>
          <h4>Payment Recorded</h4>
          <p>Receipt Reference: <strong>{receiptNo}</strong></p>
          <p style={{ fontSize: 12.5, color: 'rgba(7,18,36,.6)', marginTop: 6 }}>Your receipt has been generated below. Download it for your records.</p>
          {cloudSaved === 'ok' && (
            <p style={{ fontSize: 11.5, color: '#075E54', marginTop: 4 }}>
              <i className="fas fa-cloud-upload-alt" style={{ marginRight: 6 }}></i>
              Synced to ML Gateway records
            </p>
          )}
          {cloudSaved === 'fail' && (
            <p style={{ fontSize: 11.5, color: '#B8564F', marginTop: 4 }}>
              <i className="fas fa-exclamation-triangle" style={{ marginRight: 6 }}></i>
              Cloud sync pending — please send proof on WhatsApp
            </p>
          )}
          <div className="ps-whatsapp-block">
            <div className="psw-title"><i className="fab fa-whatsapp" aria-hidden="true"></i> Step 1 — Send Proof to ML Gateway</div>
            <p>To confirm your payment, please send the confirmation below to our team on WhatsApp <strong>+260 768 526 191</strong>. They will compare your details against our records and confirm receipt.</p>

            <a
              href={whatsappUrl}
              className="btn-whatsapp"
              target="_blank"
              rel="noopener noreferrer"
              onClick={() => setWhatsappSent(true)}
            >
              <i className="fab fa-whatsapp" aria-hidden="true"></i>
              <span>{whatsappOpened ? 'Open WhatsApp again' : 'Send Proof to WhatsApp'}</span>
            </a>

            <button
              type="button"
              onClick={copyWhatsappMessage}
              style={{
                display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8,
                width: '100%', marginTop: 10, padding: '11px 18px',
                background: '#fff', border: '1.5px solid #25D366', color: '#075E54',
                borderRadius: 10, fontSize: 13, fontWeight: 700, cursor: 'pointer',
                fontFamily: 'inherit', transition: 'all .2s ease'
              }}
            >
              <i className={`fas ${copiedMessage ? 'fa-check' : 'fa-copy'}`} aria-hidden="true"></i>
              {copiedMessage ? 'Message copied to clipboard' : 'Copy message (if WhatsApp is blocked)'}
            </button>

            <div className="psw-note">If WhatsApp does not open automatically, use the green button above. If it is still blocked, copy the message and send it manually to <strong>+260 768 526 191</strong>.</div>
            {whatsappSent && <div className="psw-sent show"><i className="fas fa-check-circle"></i> Confirmation ready — please tap <strong>Send</strong> in WhatsApp.</div>}
          </div>
          <div className="receipt-section">
            <div className="receipt-section-head">
              <div><h5><i className="fas fa-file-invoice" style={{ color: '#8A6828', marginRight: 6 }}></i> Your Receipt</h5><div className="rsh-sub">Download or print for your records</div></div>
              <div className="receipt-buttons">
                <button type="button" className="receipt-btn receipt-btn-gold" onClick={downloadReceiptPDF} disabled={generatingPDF}><i className={`fas ${generatingPDF ? 'fa-spinner fa-spin' : 'fa-download'}`}></i> {generatingPDF ? 'Generating…' : 'Download PDF'}</button>
                <button type="button" className="receipt-btn" onClick={printReceipt}><i className="fas fa-print"></i> Print</button>
              </div>
            </div>
            <Receipt data={receiptData} id="mlgReceipt" />
            <div className="receipt-check">
              <h6><i className="fas fa-search"></i> Check receipt status later</h6>
              <div className="receipt-check-row">
                <input type="text" value={checkRef} onChange={e => setCheckRef(e.target.value)} placeholder="Enter your Receipt No (e.g. MLG-2026-00001)" />
                <button type="button" className="btn btn-primary btn-sm" onClick={lookupReceipt}>Check</button>
              </div>
              {checkResult && <div className="receipt-check-result show">{checkResult}</div>}
            </div>
          </div>
          {errorMsg && <p style={{ color: '#DC3545', fontSize: 12.5, marginTop: 12 }}>{errorMsg}</p>}
          {onClose && <button type="button" className="btn btn-outline btn-sm" onClick={onClose} style={{ marginTop: 18 }}>Close</button>}
        </div>
      </div>
    );
  }

  const m = method ? PAYMENT_METHODS[method] : null;
  return (
    <div>
      <div className="pay-amount-banner">
        <div>
          <div className="pab-label">Amount Due</div>
          <div className="pab-amount">{amount}</div>
          <div className="pab-context">{purposeDetail || purpose}</div>
        </div>
        <i className="fas fa-shield-alt pab-icon"></i>
      </div>
      <div className="fee-tier-note">
        <i className="fas fa-info-circle"></i>
        <div><strong>Purpose:</strong> {purpose}. <strong>Method:</strong> Choose the payment method that works for you. Every payment is verified before your request proceeds.</div>
      </div>
      <div className="pay-methods-grid" role="radiogroup" aria-label="Payment method">
        {Object.entries(PAYMENT_METHODS).map(([key, pm]) => {
          const isSelected = method === key;
          return (
            <button key={key} type="button" role="radio" aria-checked={isSelected} className={`pay-method-card pm-${key} ${isSelected ? 'selected' : ''}`} onClick={() => setMethod(key)}>
              <div className="pm-logo">
                {key === 'airtel' ? 'airtel' : key === 'mtn' ? 'MTN' : key === 'bank' ? <i className="fas fa-university"></i> : key === 'paypal' ? <i className="fab fa-paypal"></i> : <i className="fab fa-bitcoin"></i>}
              </div>
              <div className="pm-name">{pm.label}</div>
              <div className="pm-desc">{pm.sub}</div>
            </button>
          );
        })}
      </div>
      {m && (
        <div className={`pay-details-panel ${m.brandClass}`}>
          <div className="pdp-header">
            <div className="pdp-icon">{m.iconSet === 'fab' ? <i className={`fab ${m.icon}`}></i> : <i className={`fas ${m.icon}`}></i>}</div>
            <div><div className="pdp-title">{m.title}</div><div className="pdp-sub">{m.sub}</div></div>
          </div>
          <div className="pdp-body">
            <div className="pdp-amount-banner"><div className="pab-l">Amount to Send</div><div className="pab-v">{amount}</div></div>
            {m.ussdCode && (
              <div className="ussd-links">
                <a className={`ussd-link ${method === 'airtel' ? 'ussd-airtel' : method === 'mtn' ? 'ussd-mtn' : ''}`} href={`tel:${encodeURIComponent(m.ussdCode)}`}><i className="fas fa-mobile-alt"></i> {m.ussdLabel} ({m.ussdCode})</a>
              </div>
            )}
            <div className="pdp-rows" style={{ marginTop: 14 }}>
              {m.rows.map((r, i) => (
                <div key={i} className="pay-detail-row">
                  <div className="pdr-info"><div className="pdr-label">{r.label}</div><div className={`pdr-value ${r.plain ? 'plain' : ''}`}>{r.value}</div></div>
                  {r.copy && <button type="button" className={`pdr-copy ${copied === r.label ? 'copied' : ''}`} onClick={() => copyText(r.copyValue || r.value, r.label)}><i className={`fas ${copied === r.label ? 'fa-check' : 'fa-copy'}`}></i></button>}
                </div>
              ))}
            </div>
            <div className="pdp-steps">
              <div className="pds-title"><i className="fas fa-list-ol"></i> How to Pay — Step by Step</div>
              <ol>{m.steps.map((s, i) => <li key={i} dangerouslySetInnerHTML={{ __html: s }} />)}</ol>
            </div>
            {m.note && <div className="pdp-warning"><i className="fas fa-info-circle"></i><div>{m.note}</div></div>}
          </div>
        </div>
      )}
      {m && (
        <div className="pay-confirm-form">
          <h4><i className="fas fa-clipboard-check"></i> Confirm You Have Paid</h4>
          <p style={{ fontSize: 12.5, color: 'rgba(7,18,36,.6)', marginBottom: 16, lineHeight: 1.6 }}>Once you have completed the transfer, confirm below. Your details will be sent to ML Gateway on WhatsApp for verification, and a receipt will be generated for you to download.</p>
          <div className="grid sm:grid-cols-2 gap-5">
            <Field label="Your Name (as on the payment)" required><TextInput value={senderName} onChange={setSenderName} placeholder="e.g. Mulenga Katyala" /></Field>
            <Field label="Phone / Email used to pay" required><TextInput value={senderContact} onChange={setSenderContact} placeholder="e.g. 076 304 9144 or you@example.com" /></Field>
          </div>
          <Field label="Transaction Reference / Transaction ID" required hint="From SMS, bank receipt, PayPal or blockchain TxID"><TextInput value={userRef} onChange={setUserRef} placeholder="e.g. 10683000119" /></Field>
          <label style={{ display: 'flex', gap: 12, alignItems: 'flex-start', fontSize: 13, color: 'rgba(7,18,36,.8)', cursor: 'pointer', lineHeight: 1.55, fontWeight: 500, marginTop: 14 }}>
            <input type="checkbox" checked={agree} onChange={e => setAgree(e.target.checked)} style={{ width: 18, height: 18, accentColor: '#F5B722', flexShrink: 0, marginTop: 2, cursor: 'pointer' }} />
            <span>I confirm I have sent <strong>{amount}</strong> to the account shown above, and I agree my details will be shared with the ML Gateway team via WhatsApp for verification.</span>
          </label>
          {errorMsg && <div style={{ background: 'rgba(220,53,69,.08)', border: '1px solid rgba(220,53,69,.3)', borderRadius: 8, padding: '10px 14px', marginTop: 12, color: '#B8564F', fontSize: 12.5, display: 'flex', alignItems: 'center', gap: 8 }}><i className="fas fa-exclamation-circle"></i> {errorMsg}</div>}
          <button type="button" onClick={handleConfirm} className="w-full mt-4 inline-flex items-center justify-center gap-2.5 font-medium rounded-sm text-[13.5px] px-8 py-4" style={{ background: '#F5B722', color: '#071224' }}>
            <i className="fas fa-check-circle"></i> I Have Paid — Generate My Receipt
          </button>
        </div>
      )}
      {!m && <p className="text-center text-[12.5px] text-[#071224]/45 mt-6 italic">Select a payment method above to see the account details and step-by-step instructions.</p>}
      {onClose && <div className="mt-4 text-center"><button onClick={onClose} className="text-[12px] text-[#071224]/50 hover:text-[#F5B722] transition-colors">Cancel</button></div>}
    </div>
  );
}

/* ============================================================
   ENGAGEMENT FLOW
   ============================================================ */
function EngagementFlow({ assessment, formData, refCode, onCommenced, onExit }) {
  const [step, setStep] = useState(0);
  const [signName, setSignName] = useState(formData.contactName || '');
  const [signRole, setSignRole] = useState(formData.contactRole || '');
  const [agreeLetter, setAgreeLetter] = useState(false);
  const [agreeProposal, setAgreeProposal] = useState(false);
  const [applyCredit, setApplyCredit] = useState(false);
  const [payData, setPayData] = useState(null);

  const quote = useMemo(() => computeEngagementFee(formData, assessment), [formData, assessment]);
  const creditAvailable = 29;
  const credit = applyCredit ? creditAvailable : 0;
  const payableNum = Math.max(quote.fee - credit, 0);
  const payableStr = '$' + payableNum.toLocaleString('en-US') + ' USD';

  const today = useMemo(() => new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }), []);
  const engRef = 'ENG-' + refCode.replace('MLG-', '');

  const letterSigned = signName.trim().length > 2 && agreeLetter;

  useEffect(() => { window.scrollTo(0, 0); }, [step]);

  const handlePaymentConfirmed = (payment) => {
    setPayData(payment);
    setStep(3);
    onCommenced({
      reference: engRef,
      paymentRef: payment.receiptNo,
      fee: quote.fee,
      creditApplied: credit,
      paid: payableNum,
      tier: assessment.tierLabel,
      geoBand: quote.band.label,
      complexity: quote.complexity,
      signedBy: signName,
      signedRole: signRole,
      date: today,
      company: formData.company,
    });
  };

  const steps = ['Engagement Proposal', 'Engagement Letter', 'Engagement Fee', 'Commenced'];

  return (
    <div className="fadein bg-[#F0F4F8] min-h-screen">
      <div className="bg-[#0F203A] border-b border-[#F5B722]/20">
        <div className="max-w-[1320px] mx-auto px-6 lg:px-10 py-4">
          <div className="flex flex-wrap items-center gap-4">
            <span className="w-2 h-2 rounded-full bg-[#F5B722] pulse-soft"></span>
            <span className="text-[11px] tracking-[0.16em] uppercase font-semibold text-[#F5B722]">Engagement pathway activated</span>
            <span className="text-[11px] text-white/40 hidden sm:inline">— your opportunity met the threshold for engagement</span>
            <span className="ml-auto text-[11px] text-white/35 font-mono tracking-wider">{engRef}</span>
          </div>
        </div>
      </div>

      <div className="bg-white border-b border-[#071224]/8">
        <div className="max-w-[1320px] mx-auto px-6 lg:px-10 py-6">
          <div className="flex flex-wrap gap-x-8 gap-y-3">
            {steps.map((s, i) => (

function FloatingAssistant() {
  const [open, setOpen] = useState(false);
  const [msg, setMsg] = useState('');
  const [chat, setChat] = useState([{ from: 'bot', text: 'Hello! I am the ML Gateway assistant. How can I help you navigate the platform today?' }]);
  const handleSend = () => {
    if (!msg.trim()) return;
    setChat([...chat, { from: 'user', text: msg }]);
    setMsg('');
    setTimeout(() => setChat(prev => [...prev, { from: 'bot', text: 'Thank you. A member of our team will follow up with you shortly. In the meantime, feel free to use the Capital Fit tool or submit an opportunity.' }]), 800);
  };
  return (
    <div className="fixed bottom-6 right-6 z-[100] flex flex-col items-end" style={{ paddingBottom: 'env(safe-area-inset-bottom)' }}>
      {open && (
        <div className="mb-4 w-80 max-w-[calc(100vw-48px)] bg-white rounded-lg shadow-2xl border border-[#071224]/10 overflow-hidden fadein-s">
          <div className="bg-[#071224] px-5 py-4 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <span className="w-2 h-2 rounded-full bg-[#F5B722] pulse-soft"></span>
              <span className="text-[12px] font-medium text-white tracking-wide">MLG Assistant</span>
            </div>
            <button onClick={() => setOpen(false)} className="text-white/50 hover:text-white transition-colors">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M1 1L11 11M11 1L1 11" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg>
            </button>
          </div>
          <div className="h-64 overflow-y-auto p-5 space-y-4 bg-[#F0F4F8]">
            {chat.map((c, i) => (
              <div key={i} className={`flex ${c.from === 'user' ? 'justify-end' : 'justify-start'}`}>
                <div className={`max-w-[85%] px-3.5 py-2.5 rounded-lg text-[12.5px] leading-relaxed ${c.from === 'user' ? 'bg-[#F5B722] text-[#071224]' : 'bg-white text-[#071224] border border-[#071224]/5'}`}>{c.text}</div>
              </div>
            ))}
          </div>
          <div className="p-3 bg-white border-t border-[#071224]/5 flex gap-2">
            <input value={msg} onChange={e => setMsg(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleSend()} placeholder="Type a message..." className="flex-1 text-[12.5px] px-3 py-2 border border-[#071224]/10 rounded focus:border-[#F5B722] outline-none" />
            <button onClick={handleSend} className="w-8 h-8 rounded bg-[#F5B722] flex items-center justify-center hover:bg-[#FFCA3A] transition-colors"><Arrow className="text-[#071224]" /></button>
          </div>
        </div>
      )}
      <button onClick={() => setOpen(!open)} className="w-14 h-14 rounded-full bg-[#F5B722] shadow-[0_4px_20px_rgba(245,183,34,0.4)] flex items-center justify-center hover:scale-105 transition-transform duration-300 group">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#071224" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="group-hover:rotate-12 transition-transform"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </button>
    </div>
  );
}

   ============================================================ */
const FIT_QUESTIONS = [
  { key: 'capitalType', q: 'What type of capital are you seeking?', options: CAPITAL_TYPES, cols: 2 },
  { key: 'amount', q: 'How much capital are you seeking?', options: AMOUNTS, cols: 3 },
  { key: 'geography', q: 'Where is the opportunity?', options: GEOS, cols: 2 },
  { key: 'sector', q: 'Which sector best describes the opportunity?', options: SECTORS, cols: 3 },
  { key: 'stage', q: 'What stage is the business at?', options: STAGES, cols: 2 },
  { key: 'purpose', q: 'What will the capital be used for?', options: PURPOSES, cols: 3, multi: true },
];

function CapitalFit({ go, onComplete }) {
  const [step, setStep] = useState(0);
  const [answers, setAnswers] = useState({});
  const [done, setDone] = useState(false);
  const [animating, setAnimating] = useState(false);
  const total = FIT_QUESTIONS.length;
  const current = FIT_QUESTIONS[step];
  const value = answers[current?.key];
  const canAdvance = current?.multi ? (value || []).length > 0 : !!value;
  const set = (v) => setAnswers({ ...answers, [current.key]: v });
  const next = () => {
    if (!canAdvance) return;
    setAnimating(true);
    setTimeout(() => { setAnimating(false); if (step < total - 1) setStep(step + 1); else setDone(true); }, 200);
  };
  const back = () => { if (step > 0) setStep(step - 1); };
  useEffect(() => { window.scrollTo(0, 0); }, [step, done]);

  if (done) {
    return (
      <div className="fadein bg-[#F0F4F8]">
        <section className="max-w-[1320px] mx-auto px-6 lg:px-10 py-14 lg:py-24">
          <div className="max-w-3xl">
            <Micro className="block mb-8">Capital Pathway — Orientation Complete</Micro>
            <h1 className="serif text-[clamp(2rem,5vw,3rem)] leading-[1.1] text-[#071224] mb-6">Orientation complete.</h1>
            <p className="text-[15.5px] leading-relaxed text-[#071224]/55 mb-10">This orientation helps frame your opportunity. To receive the full automated screening and a formal decision, submit your opportunity and pay the non-refundable Submission &amp; Assessment Fee.</p>
            <div className="bg-[#071224] p-6 lg:p-8 rounded-sm mb-10">
              <div className="flex flex-wrap items-center gap-3 mb-4"><span className="w-2 h-2 rounded-full bg-[#F5B722] pulse-soft"></span><Micro light>Next step — Paid submission</Micro></div>
              <p className="text-[14px] text-white/60 mb-5">Submission &amp; Assessment Fee: <strong className="text-[#F5B722]">K83 (Zambia)</strong> · <strong className="text-[#F5B722]">$7 USD (rest of world)</strong>.</p>
              <Btn variant="primary" onClick={() => onComplete(answers)}>Proceed to submission <Arrow /></Btn>
            </div>
            <Btn variant="ghost" onClick={() => { setDone(false); setStep(0); }}>Change my answers</Btn>
          </div>
        </section>
      </div>
    );
  }

  return (
    <div className="fadein bg-[#F0F4F8] min-h-[80vh] flex items-center">
      <section className="max-w-[1320px] mx-auto px-6 lg:px-10 py-14 lg:py-20 w-full">
        <div className="grid lg:grid-cols-[1.35fr_1fr] gap-12 lg:gap-16">
          <div>
            <Micro className="block mb-8">Find Your Capital Pathway</Micro>
            <div className="flex items-center gap-4 mb-10">
              <div className="flex-1 h-1 bg-[#071224]/10 rounded-full overflow-hidden">
                <div className="h-full bg-[#F5B722] rounded-full transition-all duration-500 ease-out" style={{ width: `${((step + 1) / total) * 100}%` }} />
              </div>
              <span className="text-[12px] font-medium text-[#071224]/45 tabular-nums whitespace-nowrap bg-white px-3 py-1 rounded-full border border-[#071224]/5">{String(step + 1).padStart(2, '0')} / {String(total).padStart(2, '0')}</span>
            </div>
            <div key={step} className={`fadein-s ${animating ? 'opacity-0 translate-y-4' : ''} transition-all duration-200`}>
              <h1 className="serif text-[clamp(1.8rem,4vw,2.8rem)] leading-[1.15] text-[#071224] mb-8">{current.q}</h1>
              {current.multi && <p className="text-[13px] text-[#071224]/45 -mt-5 mb-7 font-medium">Select all that apply</p>}
              <ChipGroup options={current.options} value={answers[current.key]} onChange={set} multi={current.multi} columns={current.cols} />
            </div>
            <div className="mt-12 flex items-center gap-4">
              {step > 0 && <Btn variant="ghost" onClick={back}>Back</Btn>}
              <Btn onClick={next} disabled={!canAdvance} size="lg">{step === total - 1 ? 'Complete orientation' : 'Continue'} <Arrow /></Btn>
            </div>
          </div>
          <aside className="space-y-6 lg:pt-12">
            <div className="bg-white border border-[#071224]/8 p-6 lg:p-8 rounded-sm">
              <Micro className="block mb-6">Your answers so far</Micro>
              {Object.keys(answers).length === 0 ? (
                <p className="text-[13px] text-[#071224]/35 italic">Nothing yet. Your selections will appear here as you go.</p>
              ) : (
                <div className="space-y-5">
                  {FIT_QUESTIONS.filter(q => answers[q.key]).map(q => (
                    <div key={q.key} className="border-l-2 border-[#F5B722] pl-4">
                      <p className="text-[10.5px] tracking-[0.14em] uppercase text-[#071224]/35 mb-1.5 font-medium">{q.key === 'capitalType' ? 'Capital type' : q.key.replace(/([A-Z])/g, ' $1').trim()}</p>
                      <p className="text-[13.5px] text-[#071224]/80 leading-snug">{Array.isArray(answers[q.key]) ? answers[q.key].join(', ') : answers[q.key]}</p>
                    </div>
                  ))}
                </div>
              )}
            </div>
            <WhatHappensNext items={[
              { t: 'Orientation only', d: 'These questions do not submit anything. They frame your opportunity.' },
              { t: 'Paid submission next', d: 'The formal assessment requires the non-refundable Submission & Assessment Fee.' },
              { t: 'Immediate decision', d: 'Once paid, our system returns APPROVE, PROCEED WITH CONDITIONS, or DECLINE.' },
            ]} />
          </aside>
        </div>
      </section>
    </div>
  );
}

                    I confirm the information provided is accurate and I consent to ML Gateway reviewing this opportunity against its private-capital network, generating engagement documentation, listing this opportunity in the curated environment accessible to verified investors, and holding this assessment on file.
                  </span>
                </button>
              </div>
            </div>

            <div className="mt-10 flex flex-wrap gap-4">
              {proceedToEngagement ? (
                <Btn size="lg" onClick={onSubmit} disabled={!f.canSubmit}>
                  {decision === 'conditional' ? 'Proceed to Engagement (conditions acknowledged)' : 'Proceed to Engagement'} <Arrow />
                </Btn>
              ) : (
                <Btn size="lg" onClick={onSubmit} disabled={!f.canSubmit}>
                  Save assessment & record submission <Arrow />
                </Btn>
              )}
              <Btn size="lg" variant="ghost" onClick={onRevise}>Revise my answers</Btn>
            </div>
            {proceedToEngagement && (
              <p className="mt-5 text-[12px] leading-relaxed text-[#071224]/45 max-w-2xl">
                On proceeding, the platform will generate your Engagement Proposal and Engagement Letter, and list your opportunity in the curated investor environment. Review and sign the letter, then pay the quoted Engagement Fee to commence.
              </p>
            )}
          </div>

          <aside className="space-y-6 lg:pt-12">
            <div className="bg-[#071224] p-6 lg:p-8 rounded-sm text-white">
              <Micro light className="block mb-6">How the assessment works</Micro>
              <div className="space-y-5 text-[12.5px] leading-relaxed text-white/55">
                <p>Every opportunity is assessed against the same criteria, applied consistently. Nothing is left to subjective judgment at the first stage.</p>
                <p>You receive a clear decision with reasoning. If you are declined, you are welcome to address the gaps and reapply — your submission will be re-screened.</p>
                <p className="text-white/40">Specific scoring criteria are internal to the platform.</p>
              </div>
            </div>

            <div className="bg-white p-6 lg:p-8 rounded-sm border border-[#071224]/8">
              <Micro className="block mb-5">After your decision</Micro>
              <div className="space-y-4">
                {[
                  { t: 'Approved or conditional', d: 'You are moved directly into the engagement pathway — proposal, letter, fee quote. Your opportunity is also listed in the curated environment for verified investors.', accent: true },
                  { t: 'Declined', d: 'Your submission is saved. The Enterprise Diagnostic is available as an optional next step.', accent: false },
                ].map((r, i) => (
                  <div key={i} className={`p-4 rounded-sm border ${r.accent ? 'bg-[#F5B722]/8 border-[#F5B722]/30' : 'bg-[#F0F4F8] border-[#071224]/8'}`}>
                    <p className={`text-[12.5px] font-semibold mb-1.5 ${r.accent ? 'text-[#B8860B]' : 'text-[#071224]'}`}>{r.t}</p>
                    <p className="text-[12px] leading-relaxed text-[#071224]/55">{r.d}</p>
                  </div>
                ))}
              </div>
            </div>

            <WhatHappensNext items={[
              { t: 'Recorded against reference', d: 'Your assessment is stored against your reference for the platform team.' },
              { t: 'Matched against mandates', d: proceedToEngagement ? 'On commencement, your opportunity is assessed against live investor criteria.' : 'If you reapply after addressing the critical items, your submission will be re-screened.' },
              { t: 'Curated introductions', d: 'Where there is fit, a named introduction is made with context already established.' },
              { t: 'You stay in control', d: 'Nothing is shared with any investor without your agreement.' },
            ]} />
            <TermsPanel />
          </aside>
        </div>
      </section>
    </div>
  );
}

/* ============================================================
   BUSINESS ACCESS
   ============================================================ */
function BusinessAccess({ go, prefill, openPurchase, onEngagementCommenced, onListCurated }) {
  const [step, setStep] = useState(0);
  const [submitted, setSubmitted] = useState(false);
  const listedRef = useRef(false);
  const [f, setF] = useState({
    company: '', country: '', sector: prefill?.sector || '', legalStructure: '', yearsOperation: '', employees: '', stage: prefill?.stage || '',
    revenue: '', revenueCurrency: 'USD', revenueTrajectory: '', ebitdaPosition: '', financialStatements: '', financialHistory: '',
    amount: prefill?.amount || '', capitalType: prefill?.capitalType || '', purposes: prefill?.purpose || [], useOfFunds: '', capTable: '', existingInvestors: '', timeline: '',
    taxCompliance: '', regulatoryLicences: '', governance: '', shareholderAgreement: '', amlReadiness: '',
    pitchDeck: '', financialModel: '', ddPack: '', managementTeam: '', keyPersonRisk: '',
    description: '',
    contactName: '', contactEmail: '', contactPhone: '', contactRole: '', consent: false,
  });
  const set = (k, v) => setF(prev => ({ ...prev, [k]: v }));
  const assessment = useMemo(() => assessOpportunity(f), [f]);
  const refCode = useMemo(() => 'MLG-' + Math.random().toString(36).slice(2, 7).toUpperCase(), []);

  const [returning, setReturning] = useState(null);
  const [returningDismissed, setReturningDismissed] = useState(false);
  const [checkingReturn, setCheckingReturn] = useState(false);

  useEffect(() => {
    const savedEmail = (() => {
      try { return localStorage.getItem('mlg_last_email') || ''; } catch { return ''; }
    })();
    if (!savedEmail || returningDismissed) return;
    let cancelled = false;
    (async () => {
      setCheckingReturn(true);
      const found = await findExistingApplicant({ email: savedEmail });
      if (!cancelled && found) setReturning(found);
      setCheckingReturn(false);
    })();
    return () => { cancelled = true; };
  }, [returningDismissed]);

  const checkReturningByEmail = async (email) => {
    if (!email || !email.includes('@') || returningDismissed) return;
    setCheckingReturn(true);
    const found = await findExistingApplicant({ email, company: f.company, phone: f.contactPhone });
    setReturning(found);
    setCheckingReturn(false);
  };

  const applyReturning = () => {
    if (!returning) return;
    setF(prev => ({
      ...prev,
      company: returning.company || prev.company,
      country: returning.country || prev.country,
      sector: returning.sector || prev.sector,
      stage: returning.stage || prev.stage,
      contactName: returning.contactName || prev.contactName,
      contactEmail: returning.email || prev.contactEmail,
      contactPhone: returning.phone || prev.contactPhone,
    }));
    setReturningDismissed(true);
    setReturning(null);
  };

  const dismissReturning = () => { setReturningDismissed(true); setReturning(null); };

  const step0Ok = f.company && f.country && f.sector && f.legalStructure && f.yearsOperation && f.stage;
  const step1Ok = f.revenue && f.revenueTrajectory && f.ebitdaPosition && f.financialStatements && f.financialHistory;
  const step2Ok = f.amount && f.capitalType && f.purposes.length > 0 && f.useOfFunds && f.capTable && f.timeline;
  const step3Ok = f.taxCompliance && f.regulatoryLicences && f.governance && f.shareholderAgreement && f.amlReadiness && f.pitchDeck && f.financialModel && f.ddPack && f.managementTeam && f.keyPersonRisk;
  const stepOk = [step0Ok, step1Ok, step2Ok, step3Ok];
  const completion = stepOk.filter(Boolean).length / stepOk.length;

  const liveSignal = useMemo(() => {
    if (!step0Ok || !step1Ok) return { label: 'Insufficient data', color: '#071224' };
    if (assessment.critical.length > 0) return { label: 'Critical issue detected', color: '#B8564F' };
    if (assessment.total >= 78) return { label: 'Strong — engagement pathway likely', color: '#F5B722' };
    if (assessment.total >= 58) return { label: 'Developing — conditional engagement likely', color: '#E0A030' };
    return { label: 'Not yet investment-ready', color: '#B8564F' };
  }, [step0Ok, step1Ok, assessment]);

  useEffect(() => { window.scrollTo(0, 0); }, [step, submitted]);

  const submissionFee = useMemo(() => getSubmissionFee(f.country), [f.country]);

  const handlePaymentConfirmed = async () => {
    const fb = await firebaseReady;
    if (fb) {
      try {
        const submissionData = sanitizeForFirestore({
          refCode,
          company: f.company,
          country: f.country,
          sector: f.sector,
          stage: f.stage,
          legalStructure: f.legalStructure,
          yearsOperation: f.yearsOperation,
          employees: f.employees,
          revenue: f.revenue,
          revenueCurrency: f.revenueCurrency,
          revenueTrajectory: f.revenueTrajectory,
          ebitdaPosition: f.ebitdaPosition,
          financialStatements: f.financialStatements,
          financialHistory: f.financialHistory,
          amount: f.amount,
          capitalType: f.capitalType,
          purposes: f.purposes,
          useOfFunds: f.useOfFunds,
          capTable: f.capTable,
          existingInvestors: f.existingInvestors,
          timeline: f.timeline,
          taxCompliance: f.taxCompliance,
          regulatoryLicences: f.regulatoryLicences,
          governance: f.governance,
          shareholderAgreement: f.shareholderAgreement,
          amlReadiness: f.amlReadiness,
          pitchDeck: f.pitchDeck,
          financialModel: f.financialModel,
          ddPack: f.ddPack,
          managementTeam: f.managementTeam,
          keyPersonRisk: f.keyPersonRisk,
          description: f.description,
          contactName: f.contactName,
          contactEmail: f.contactEmail,
          contactPhone: f.contactPhone,
          contactRole: f.contactRole,
          assessmentDecision: assessment.decision,
          assessmentTier: assessment.tierLabel,
          assessmentScore: assessment.total,
          conditions: assessment.conditions,
          positives: assessment.positives,
          critical: assessment.critical
        });
        await FB.setDoc(
          FB.doc(fbDb, 'submissions', refCode),
          { ...submissionData, submittedAt: FB.serverTimestamp() },
          { merge: true }
        );
        console.log('[MLG] ✅ Submission saved to Firestore:', refCode);

        if (f.contactEmail && f.contactEmail.includes('@')) {
          const emailKey = f.contactEmail.toLowerCase().trim();
          const indexData = sanitizeForFirestore({
            email: emailKey,
            company: f.company || '',
            phone: f.contactPhone || '',
            contactName: f.contactName || '',
            refCode: refCode,
            sector: f.sector || '',
            country: f.country || '',
            stage: f.stage || ''
          });
          await FB.setDoc(
            FB.doc(fbDb, 'applicant_index', emailKey),
            { ...indexData, lastSubmission: FB.serverTimestamp() },
            { merge: true }
          );
          console.log('[MLG] ✅ Applicant index updated:', emailKey);
          try { localStorage.setItem('mlg_last_email', emailKey); } catch {}
        }
      } catch (e) {
        console.error('[MLG] ❌ Submission write FAILED:', e && e.code, e && e.message, e);
      }
    } else {
      console.warn('[MLG] Firebase not ready — submission not persisted to cloud.');
    }
    setStep(5);
  };

  const handleSubmit = () => {
    if (assessment.decision === 'approve' || assessment.decision === 'conditional') {
      if (!listedRef.current) {
        listedRef.current = true;
        if (onListCurated) onListCurated(assessment, f, refCode);
      }
      setStep(6);
    } else {
      setSubmitted(true);
    }
  };

  const steps = ['Business identity', 'Financial profile', 'Capital raise', 'Governance & readiness'];

  if (step === 6) {
    return (
      <EngagementFlow
        assessment={assessment}
        formData={f}
        refCode={refCode}
        onCommenced={(record) => { onEngagementCommenced(record, assessment, f); }}
        onExit={() => go('home')}
      />
    );
  }

  if (step === 5) {
    return (
      <div className="fadein bg-[#F0F4F8]">
        <section className="max-w-[1320px] mx-auto px-6 lg:px-10 py-8 lg:py-10">
          <button onClick={() => setStep(4)} className="inline-flex items-center gap-2 text-[12px] text-[#071224]/50 hover:text-[#F5B722] transition-colors mb-6">
            <svg width="14" height="10" viewBox="0 0 14 10" fill="none"><path d="M5 1L1 5L5 9M1 5H13" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
            Back to payment
          </button>
        </section>
        <AssessmentResult
          assessment={assessment}
          formData={f}
          f={{
            contactName: f.contactName, contactEmail: f.contactEmail, contactRole: f.contactRole, consent: f.consent,
            setContactName: (v) => set('contactName', v),
            setContactEmail: (v) => set('contactEmail', v),
            setContactRole: (v) => set('contactRole', v),
            toggleConsent: () => set('consent', !f.consent),
            canSubmit: f.contactName && f.contactEmail && f.consent,
          }}
          onRevise={() => setStep(0)}
          onSubmit={handleSubmit}
          submitted={submitted}
          refCode={refCode}
          openPurchase={openPurchase}
        />
      </div>
    );
  }

  if (step === 4) {
    return (
      <div className="fadein bg-[#F0F4F8]">
        <section className="max-w-[1320px] mx-auto px-6 lg:px-10 py-14 lg:py-20">
          <div className="max-w-3xl mx-auto">
            <button onClick={() => setStep(3)} className="inline-flex items-center gap-2 text-[12px] text-[#071224]/50 hover:text-[#F5B722] transition-colors mb-6">
              <svg width="14" height="10" viewBox="0 0 14 10" fill="none"><path d="M5 1L1 5L5 9M1 5H13" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
              Back to form
            </button>
            <Micro className="block mb-6">Step 5 — Submission &amp; Assessment Fee</Micro>
            <h1 className="serif text-[clamp(2rem,4.5vw,3rem)] leading-[1.1] text-[#071224] mb-6">Pay the Submission &amp; Assessment Fee.</h1>
            <p className="text-[15.5px] leading-relaxed text-[#071224]/55 mb-10 max-w-2xl">This non-refundable fee activates the platform assessment. Once your payment is recorded, the system screens your opportunity against a consistent set of criteria and returns an immediate decision.</p>
            <div className="bg-white rounded-sm border border-[#071224]/8 p-6 lg:p-8">
              <PaymentFlow
                amount={submissionFee.amount}
                currency={submissionFee.currency}
                purpose="Opportunity Submission & Assessment Fee"
                purposeDetail={submissionFee.currency === 'ZMW' ? 'Non-refundable. Covers automated platform assessment for Zambian-registered businesses.' : 'Non-refundable. Covers automated platform assessment.'}
                applicant={{ firstName: f.contactName.split(' ')[0] || f.contactName, lastName: f.contactName.split(' ').slice(1).join(' '), email: f.contactEmail, phone: f.contactPhone, country: f.country, company: f.company }}
                receiptPrefix="MLG-SUB"
                onConfirmed={handlePaymentConfirmed}
              />
            </div>
          </div>
        </section>
      </div>
    );
  }

  return (
    <div className="fadein bg-[#F0F4F8]">
      <section className="max-w-[1320px] mx-auto px-6 lg:px-10 py-14 lg:py-20">
        <div className="grid lg:grid-cols-[1.35fr_1fr] gap-12 lg:gap-16">
          <div>
            <Micro className="block mb-8">For Businesses — Paid Assessment</Micro>
            <h1 className="serif text-[clamp(2rem,5vw,3.2rem)] leading-[1.1] text-[#071224] mb-5">Access private capital.</h1>
            <p className="text-[16px] leading-relaxed text-[#071224]/55 max-w-2xl mb-8">
              Complete the structured assessment form. Proceed to payment of the non-refundable Submission &amp; Assessment Fee to activate the platform screening and receive your decision.
            </p>
            <div className="flex flex-wrap items-center gap-3 mb-6 p-4 bg-white rounded-sm border border-[#071224]/8">
              <span className="w-2 h-2 rounded-full pulse-soft" style={{ background: liveSignal.color }}></span>
              <span className="text-[11px] tracking-[0.14em] uppercase font-semibold text-[#071224]/50">Live signal</span>
              <span className="text-[12.5px] font-medium" style={{ color: liveSignal.color }}>{liveSignal.label}</span>
              <span className="ml-auto text-[11.5px] text-[#071224]/40 tabular-nums">{Math.round(completion * 100)}% complete</span>
            </div>

            {checkingReturn && (
              <div className="mb-6 p-4 bg-[#E7F4FF] border border-[#009CDE]/30 rounded-sm flex items-center gap-3 fadein">
                <i className="fas fa-spinner fa-spin" style={{ color: '#009CDE', fontSize: 14 }} aria-hidden="true"></i>
                <span className="text-[12.5px] text-[#0A4D6E]">Checking for a previous submission…</span>
              </div>
            )}

            {returning && !returningDismissed && (
              <div className="mb-6 p-5 lg:p-6 bg-gradient-to-br from-[#F5B722]/10 to-[#F5B722]/5 border-2 border-[#F5B722]/40 rounded-sm fadein">
                <div className="flex items-start gap-4">
                  <span className="w-10 h-10 shrink-0 rounded-full bg-[#F5B722] flex items-center justify-center">
                    <i className="fas fa-user-check" style={{ color: '#071224', fontSize: 16 }} aria-hidden="true"></i>
                  </span>
                  <div className="flex-1 min-w-0">
                    <p className="text-[14px] font-semibold text-[#071224] mb-1">
                      Welcome back{returning.contactName ? ', ' + returning.contactName.split(' ')[0] : ''} — we found your previous submission
                    </p>
                    <p className="text-[12.5px] leading-relaxed text-[#071224]/65 mb-4">
                      Matched by <strong>{returning.matchedBy}</strong>. Reference <strong className="font-mono">{returning.refCode}</strong>
                      {returning.company ? ' · ' + returning.company : ''}
                      {returning.country ? ' · ' + returning.country : ''}
                    </p>
                    <div className="flex flex-wrap gap-3">
                      <button
                        type="button"
                        onClick={applyReturning}
                        className="inline-flex items-center gap-2 bg-[#071224] text-white px-4 py-2.5 rounded-sm text-[12.5px] font-semibold hover:bg-[#0F203A] transition-all">
                        <i className="fas fa-magic" style={{ fontSize: 12 }} aria-hidden="true"></i>
                        Prefill my details
                      </button>
                      <button
                        type="button"
                        onClick={dismissReturning}
                        className="inline-flex items-center gap-2 text-[#071224]/55 hover:text-[#071224] px-4 py-2.5 rounded-sm text-[12.5px] font-medium transition-colors">
                        Start fresh
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            )}

            <div className="flex flex-wrap gap-x-6 gap-y-3 mb-10 pb-6 border-b border-[#071224]/10">
              {steps.map((s, i) => (
                <button key={s} onClick={() => i < step && setStep(i)}
                  className={`flex items-center gap-2.5 text-[12.5px] font-medium transition-all duration-200 ${i === step ? 'text-[#071224]' : i < step ? 'text-[#F5B722] hover:text-[#B8860B]' : 'text-[#071224]/25 cursor-default'}`}>
                  <span className={`w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-bold shrink-0 ${i === step ? 'bg-[#F5B722] text-[#071224]' : i < step ? 'bg-[#F5B722]/20 text-[#F5B722]' : 'bg-[#071224]/10 text-[#071224]/40'}`}>{i < step ? '✓' : String(i + 1)}</span>
                  {s}
                </button>
              ))}
            </div>

            <div key={step} className="fadein-s space-y-8">
              {step === 0 && (
                <>
                  <Field label="Company / group name" required><TextInput value={f.company} onChange={v => set('company', v)} placeholder="Registered or trading name" /></Field>
                  <div className="grid sm:grid-cols-2 gap-7">
                    <Field label="Country of registration" required hint="Determines submission fee"><Select value={f.country} onChange={v => set('country', v)} options={COUNTRIES} placeholder="Select country" /></Field>
                    <Field label="Sector" required><Select value={f.sector} onChange={v => set('sector', v)} options={SECTORS} placeholder="Select sector" /></Field>
                  </div>
                  <div className="grid sm:grid-cols-2 gap-7">
                    <Field label="Legal structure" required hint="Determines investor eligibility"><Select value={f.legalStructure} onChange={v => set('legalStructure', v)} options={LEGAL_STRUCTURES} placeholder="Select structure" /></Field>
                    <Field label="Years in operation" required><Select value={f.yearsOperation} onChange={v => set('yearsOperation', v)} options={YEARS_OPS} placeholder="Select range" /></Field>
                  </div>
                  <div className="grid sm:grid-cols-2 gap-7">
                    <Field label="Number of employees" hint="Optional"><Select value={f.employees} onChange={v => set('employees', v)} options={EMPLOYEE_BANDS} placeholder="Select band" /></Field>
                    <Field label="Business stage" required><Select value={f.stage} onChange={v => set('stage', v)} options={STAGES} placeholder="Select stage" /></Field>
                  </div>
                </>
              )}
              {step === 1 && (
                <>
                  <div>
                    <Label required hint="Last 12 months">Revenue (annual)</Label>
                    <div className="grid grid-cols-[1fr_auto] gap-3">
                      <TextInput value={f.revenue} onChange={v => set('revenue', v)} placeholder="e.g. 1250000" />
                      <div className="w-28"><Select value={f.revenueCurrency} onChange={v => set('revenueCurrency', v)} options={CURRENCIES} placeholder="USD" /></div>
                    </div>
                    <p className="mt-2 text-[11.5px] text-[#071224]/40">Enter the most recent full-year revenue figure. No commas.</p>
                  </div>
                  <Field label="Revenue trajectory" required><ChipGroup options={REVENUE_TRAJ} value={f.revenueTrajectory} onChange={v => set('revenueTrajectory', v)} columns={2} /></Field>
                  <Field label="EBITDA position" required><ChipGroup options={EBITDA_POS} value={f.ebitdaPosition} onChange={v => set('ebitdaPosition', v)} columns={2} /></Field>
                  <Field label="Financial statements available" required hint="Most recent full year"><ChipGroup options={FIN_STMTS} value={f.financialStatements} onChange={v => set('financialStatements', v)} columns={2} /></Field>
                  <Field label="Years of financial records" required><ChipGroup options={FIN_HISTORY} value={f.financialHistory} onChange={v => set('financialHistory', v)} columns={3} /></Field>
                </>
              )}
              {step === 2 && (
                <>
                  <div className="grid sm:grid-cols-2 gap-7">
                    <Field label="Amount of capital required" required><Select value={f.amount} onChange={v => set('amount', v)} options={AMOUNTS} placeholder="Select range" /></Field>
                    <Field label="Type of capital sought" required><Select value={f.capitalType} onChange={v => set('capitalType', v)} options={CAPITAL_TYPES.map(c => c.v)} placeholder="Select type" /></Field>
                  </div>
                  <div>
                    <Label required>Purpose of capital</Label>
                    <p className="text-[12.5px] text-[#071224]/45 mb-4">Select all that apply.</p>
                    <ChipGroup options={PURPOSES} value={f.purposes} onChange={v => set('purposes', v)} multi columns={2} />
                  </div>
                  <Field label="Use of funds documented" required hint="Detailed allocation ready"><ChipGroup options={USE_OF_FUNDS} value={f.useOfFunds} onChange={v => set('useOfFunds', v)} columns={2} /></Field>
                  <Field label="Cap table clarity" required><ChipGroup options={CAP_TABLE} value={f.capTable} onChange={v => set('capTable', v)} columns={2} /></Field>
                  <Field label="Existing shareholder base" hint="Optional"><ChipGroup options={['Founder-owned, no external investors','Existing investors aligned and supportive','Existing investors passive','Complex or misaligned shareholder base']} value={f.existingInvestors} onChange={v => set('existingInvestors', v)} columns={2} /></Field>
                  <Field label="Target timeline" required><ChipGroup options={TIMELINES} value={f.timeline} onChange={v => set('timeline', v)} columns={3} /></Field>
                  <Field label="Brief description of the opportunity" hint="Optional but helpful"><TextArea value={f.description} onChange={v => set('description', v)} rows={3} placeholder="What the business does, the opportunity, and why capital is required now." /></Field>
                </>
              )}
              {step === 3 && (
                <>
                  <div>
                    <Micro className="block mb-6">Governance & compliance</Micro>
                    <div className="space-y-7">
                      <Field label="Tax compliance" required><ChipGroup options={TAX_COMPLIANCE} value={f.taxCompliance} onChange={v => set('taxCompliance', v)} columns={2} /></Field>
                      <Field label="Regulatory licences" required><ChipGroup options={REG_LICENCES} value={f.regulatoryLicences} onChange={v => set('regulatoryLicences', v)} columns={2} /></Field>
                      <Field label="Board governance" required><ChipGroup options={GOVERNANCE} value={f.governance} onChange={v => set('governance', v)} columns={2} /></Field>
                      <Field label="Shareholder agreement" required><ChipGroup options={SHA} value={f.shareholderAgreement} onChange={v => set('shareholderAgreement', v)} columns={2} /></Field>
                      <Field label="KYC / AML readiness" required><ChipGroup options={AML} value={f.amlReadiness} onChange={v => set('amlReadiness', v)} columns={2} /></Field>
                    </div>
                  </div>
                  <div className="pt-10 border-t border-[#071224]/10">
                    <Micro className="block mb-6">Investment readiness</Micro>
