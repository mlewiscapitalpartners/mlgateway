/* ============================================================
   APP
   ============================================================ */
function App() {
  const [route, setRoute] = useState('home');
  const [fitAnswers, setFitAnswers] = useState(null);
  const [modalOpen, setModalOpen] = useState(false);
  const [modalCourtesy, setModalCourtesy] = useState(null);
  const [modalContext, setModalContext] = useState('');
  const [engagement, setEngagement] = useState(null);

  const [accessModalOpen, setAccessModalOpen] = useState(false);

  const [curatedOpps, setCuratedOpps] = useState(() => {
    try {
      const stored = localStorage.getItem('mlg_curated_opps');
      return stored ? JSON.parse(stored) : SEED_CURATED_OPPORTUNITIES;
    } catch { return SEED_CURATED_OPPORTUNITIES; }
  });

  const [investorUnlocked, setInvestorUnlocked] = useState(() => {
    try { return localStorage.getItem('mlg_investor_access') === 'true'; } catch { return false; }
  });

  const persistCurated = useCallback((list) => {
    try { localStorage.setItem('mlg_curated_opps', JSON.stringify(list)); } catch {}
  }, []);

  const addCuratedOpportunity = useCallback((opp) => {
    setCuratedOpps(prev => {
      if (prev.some(o => o.id === opp.id)) return prev;
      const next = [opp, ...prev];
      persistCurated(next);
      return next;
    });
    (async () => {
      const fb = await firebaseReady;
      if (fb) {
        try {
          const clean = sanitizeForFirestore(opp);
          await FB.setDoc(FB.doc(fbDb, 'curated_opportunities', opp.id), { ...clean, createdAt: FB.serverTimestamp() }, { merge: true });
          console.log('[MLG] ✅ Curated opportunity saved:', opp.id);
        } catch(e) { console.error('[MLG] ❌ Curated opportunity write FAILED:', e && e.code, e && e.message, e); }
      }
    })();
  }, [persistCurated]);

  const unlockInvestorAccess = useCallback(() => {
    setInvestorUnlocked(true);
    try { localStorage.setItem('mlg_investor_access', 'true'); } catch {}
  }, []);

  const go = useCallback((r) => {
    setRoute(r);
    window.scrollTo({ top: 0, behavior: 'auto' });
  }, []);

  const openPurchase = useCallback((courtesyAmount, context) => {
    setModalCourtesy(courtesyAmount ?? null);
    setModalContext(context || '');
    setModalOpen(true);
  }, []);

  const openInvestorAccess = useCallback(() => setAccessModalOpen(true), []);

  const handleFitComplete = (answers) => { setFitAnswers(answers); go('businesses'); };

  const handleEngagementCommenced = useCallback((record) => {
    setEngagement(record);
  }, []);

  const handleListCurated = useCallback((assessment, formData, refCode) => {
    if (!assessment || !formData) return;
    if (assessment.decision !== 'approve' && assessment.decision !== 'conditional') return;
    const year = new Date().getFullYear();
    const id = 'OPP-' + year + '-' + Math.random().toString(36).slice(2, 6).toUpperCase();
    const label = (formData.capitalType || 'Capital') + ' for a ' + (formData.sector ? formData.sector.toLowerCase() : 'business');
    const opp = {
      id,
      refCode,
      sector: formData.sector,
      country: formData.country,
      stage: formData.stage,
      amount: formData.amount,
      capitalType: formData.capitalType,
      purposes: formData.purposes || [],
      tierLabel: assessment.tierLabel,
      status: assessment.decision === 'approve' ? 'Investment-Ready' : 'Growth-Ready',
      score: assessment.total,
      label,
      listedAt: new Date().toISOString().slice(0, 10),
    };
    addCuratedOpportunity(opp);
  }, [addCuratedOpportunity]);

  const view = () => {
    switch (route) {
      case 'fit': return <CapitalFit go={go} onComplete={handleFitComplete} />;
      case 'businesses': return <BusinessAccess go={go} prefill={fitAnswers} openPurchase={openPurchase} onEngagementCommenced={handleEngagementCommenced} onListCurated={handleListCurated} />;
      case 'diagnostic': return <DiagnosticPage go={go} openPurchase={openPurchase} />;
      case 'investors': return <InvestorAccess go={go} />;
      case 'network': return <Network go={go} />;
      case 'how': return <HowItWorks go={go} openPurchase={openPurchase} />;
      case 'opportunities': return <Opportunities go={go} curatedOpps={curatedOpps} investorUnlocked={investorUnlocked} onUnlock={openInvestorAccess} />;
      case 'insights': return <Insights go={go} />;
      case 'about': return <About go={go} />;
      default: return <Home go={go} openPurchase={openPurchase} />;
    }
  };

  return (
    <div className="min-h-screen bg-[#F0F4F8] flex flex-col">
      <Nav route={route} go={go} engagementActive={!!engagement} />
      <main className="flex-1">{view()}</main>
      <Footer go={go} />
      <FloatingAssistant />
      <PurchaseModal open={modalOpen} onClose={() => setModalOpen(false)} courtesyAmount={modalCourtesy} context={modalContext} />
      <InvestorAccessModal open={accessModalOpen} onClose={() => setAccessModalOpen(false)} onUnlocked={unlockInvestorAccess} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
