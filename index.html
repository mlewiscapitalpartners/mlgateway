<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ML Gateway — Private Capital Access</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
  html { scroll-behavior: smooth; }
  body { font-family: 'Inter', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  .serif { font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-weight: 400; }
  .micro { font-size: 10.5px; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 500; }
  ::selection { background: #B0863C; color: #F7F5F0; }
  input, select, textarea { font-family: 'Inter', system-ui, sans-serif; }
  input:focus, select:focus, textarea:focus { outline: none; }
  .fadein { animation: fadein .45s cubic-bezier(.22,.61,.36,1) both; }
  @keyframes fadein { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .fadein-s { animation: fadein .3s ease both; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: #EFEBE3; }
  ::-webkit-scrollbar-thumb { background: #C9C2B4; border-radius: 0; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect, useRef, useCallback } = React;

/* ============================================================
   TOKENS
   ============================================================ */
const INK = '#0C1014';
const INK2 = '#141A21';
const INK3 = '#1E262F';
const PAPER = '#F7F5F0';
const PAPER2 = '#EFEBE3';
const BRASS = '#B0863C';
const BRASS_LT = '#D2A85F';

/* ============================================================
   DATA
   ============================================================ */
const SECTORS = [
  'Agriculture & agribusiness','Financial services','Healthcare & life sciences',
  'Education','Energy & renewables','Infrastructure','Technology & software',
  'Consumer & retail','Industrial & manufacturing','Logistics & transport',
  'Real estate & property','Mining & natural resources','Telecoms & media',
  'Hospitality & tourism','Water & sanitation','Other'
];

const COUNTRIES = [
  'South Africa','Kenya','Nigeria','Ghana','Egypt','Morocco','Tanzania','Uganda','Rwanda',
  'Ethiopia','Senegal','Côte d\u2019Ivoire','Zambia','Zimbabwe','Botswana','Namibia','Mozambique',
  'Mauritius','Cameroon','Tunisia','Algeria','Angola','DR Congo','Malawi','Madagascar','Seychelles',
  'Cape Verde','Gabon','Benin','Burkina Faso','Mali','Niger','Togo','Sierra Leone','Liberia',
  'Gambia','Guinea','South Sudan','Sudan','Somalia','Lesotho','Eswatini','Burundi','Chad',
  'Congo (Brazzaville)','Equatorial Guinea','Djibouti','Libya','Mauritania',
  'United Kingdom','United States','United Arab Emirates','Other'
];

const CURRENCIES = ['USD','EUR','GBP','ZAR','KES','NGN','GHS','XOF','XAF','MAD','EGP','AED','Other'];

const STAGES = ['Pre-revenue / early','Revenue-generating','Profitable & scaling','Mature / established'];

const CAPITAL_TYPES = [
  { v: 'Equity', d: 'Permanent or long-dated equity capital' },
  { v: 'Growth capital', d: 'Expansion capital without full control' },
  { v: 'Strategic capital', d: 'Capital plus strategic or operational value' },
  { v: 'Acquisition capital', d: 'Buy-outs, buy-ins, buy-and-build' },
  { v: 'Project & infrastructure capital', d: 'Asset-backed, project-financed' },
  { v: 'Other', d: 'Structured, mezzanine, revenue-based, hybrid' }
];

const AMOUNTS = ['Under $1m','$1m – $5m','$5m – $10m','$10m – $25m','$25m – $50m','$50m+'];

const GEOS = [
  { v: 'Africa', d: 'The opportunity is on the continent' },
  { v: 'Africa expansion', d: 'Existing business expanding across Africa' },
  { v: 'African acquisition', d: 'Acquiring an African business or asset' },
  { v: 'Other', d: 'Outside Africa or multi-region' }
];

const PURPOSES = [
  'Growth capital','Expansion capital','Acquisition capital','Project capital',
  'Working capital','Balance sheet strengthening','Strategic investor','Refinancing','Other'
];

/* ============================================================
   MATCH ENGINE
   ============================================================ */
function computeFit(a) {
  const cats = [];
  const add = (name, blurb, ticket, why) => {
    const ex = cats.find(c => c.name === name);
    if (ex) { if (why && !ex.reasons.includes(why)) ex.reasons.push(why); return; }
    cats.push({ name, blurb, ticket, reasons: why ? [why] : [] });
  };

  const t = a.capitalType, amt = a.amount, geo = a.geography, st = a.stage;

  if (t === 'Equity') {
    add('Growth equity funds', 'Funds taking minority or significant-minority positions in revenue-generating businesses.', '$3m – $25m', 'You are seeking equity capital');
    add('Private equity', 'Control and co-control investors with sector theses and operational capability.', '$5m – $50m', 'Equity mandate');
  }
  if (t === 'Growth capital') {
    add('Growth capital funds', 'Dedicated growth investors funding expansion without requiring control.', '$3m – $25m', 'Growth capital mandate');
    add('Family offices', 'Patient private capital with flexible structures and longer horizons.', '$1m – $20m', 'Growth capital mandate');
  }
  if (t === 'Strategic capital') {
    add('Strategic & corporate investors', 'Corporates investing for commercial synergy alongside financial return.', '$5m+', 'Strategic capital mandate');
    add('Family offices', 'Patient private capital with flexible structures and longer horizons.', '$1m – $20m', 'Strategic capital mandate');
  }
  if (t === 'Acquisition capital') {
    add('Acquisition & buy-and-build capital', 'Investors backing buy-outs, buy-ins and consolidation strategies.', '$5m – $100m', 'Acquisition mandate');
    add('Private equity', 'Control and co-control investors with sector theses and operational capability.', '$5m – $50m', 'Acquisition mandate');
    add('Mezzanine & structured capital', 'Subordinated debt and hybrid capital sitting between senior debt and equity.', '$5m – $30m', 'Acquisition mandate');
  }
  if (t === 'Project & infrastructure capital') {
    add('Project & infrastructure capital', 'Asset-backed investors funding defined projects with contracted cash flows.', '$10m – $250m', 'Project & infrastructure mandate');
    add('Development finance institutions', 'DFIs deploying long-dated capital with development mandates.', '$10m – $100m', 'Project & infrastructure mandate');
    add('Sovereign & institutional capital', 'Large-ticket institutional allocators and sovereign investors.', '$25m+', 'Project & infrastructure mandate');
  }
  if (t === 'Other') {
    add('Family offices', 'Patient private capital with flexible structures and longer horizons.', '$1m – $20m', 'Flexible / structured mandate');
    add('Mezzanine & structured capital', 'Subordinated debt and hybrid capital sitting between senior debt and equity.', '$5m – $30m', 'Flexible / structured mandate');
  }

  if (amt === 'Under $1m') {
    add('Angel & early-stage networks', 'Individual and syndicate investors backing early-stage businesses.', '$100k – $2m', 'Ticket size under $1m');
    add('Revenue-based & structured finance', 'Non-dilutive capital repaid as a percentage of revenue.', '$250k – $5m', 'Ticket size under $1m');
  }
  if (amt === '$1m – $5m') {
    add('Family offices', 'Patient private capital with flexible structures and longer horizons.', '$1m – $20m', 'Ticket size $1m – $5m');
    add('Impact & blended finance', 'Investors targeting measurable impact alongside financial return.', '$1m – $25m', 'Ticket size $1m – $5m');
    add('Pan-African growth funds', 'Regional funds with on-the-ground presence across African markets.', '$2m – $20m', 'Ticket size $1m – $5m');
  }
  if (amt === '$5m – $10m') {
    add('Growth capital funds', 'Dedicated growth investors funding expansion without requiring control.', '$3m – $25m', 'Ticket size $5m – $10m');
    add('Pan-African growth funds', 'Regional funds with on-the-ground presence across African markets.', '$2m – $20m', 'Ticket size $5m – $10m');
    add('Regional private credit funds', 'Senior and unitranche lenders providing non-dilutive growth funding.', '$5m – $50m', 'Ticket size $5m – $10m');
  }
  if (amt === '$10m – $25m') {
    add('Private equity', 'Control and co-control investors with sector theses and operational capability.', '$5m – $50m', 'Ticket size $10m – $25m');
    add('Development finance institutions', 'DFIs deploying long-dated capital with development mandates.', '$10m – $100m', 'Ticket size $10m – $25m');
    add('Mezzanine & structured capital', 'Subordinated debt and hybrid capital sitting between senior debt and equity.', '$5m – $30m', 'Ticket size $10m – $25m');
  }
  if (amt === '$25m – $50m' || amt === '$50m+') {
    add('Sovereign & institutional capital', 'Large-ticket institutional allocators and sovereign investors.', '$25m+', 'Ticket size above $25m');
    add('Development finance institutions', 'DFIs deploying long-dated capital with development mandates.', '$10m – $100m', 'Ticket size above $25m');
    add('Project & infrastructure capital', 'Asset-backed investors funding defined projects with contracted cash flows.', '$10m – $250m', 'Large-ticket mandate');
  }

  if (geo === 'Africa') {
    add('Development finance institutions', 'DFIs deploying long-dated capital with development mandates.', '$10m – $100m', 'African opportunity');
    add('Impact & blended finance', 'Investors targeting measurable impact alongside financial return.', '$1m – $25m', 'African opportunity');
    add('Pan-African growth funds', 'Regional funds with on-the-ground presence across African markets.', '$2m – $20m', 'African opportunity');
  }
  if (geo === 'Africa expansion') {
    add('Pan-African growth funds', 'Regional funds with on-the-ground presence across African markets.', '$2m – $20m', 'Pan-African expansion');
    add('Development finance institutions', 'DFIs deploying long-dated capital with development mandates.', '$10m – $100m', 'Pan-African expansion');
  }
  if (geo === 'African acquisition') {
    add('Acquisition & buy-and-build capital', 'Investors backing buy-outs, buy-ins and consolidation strategies.', '$5m – $100m', 'African acquisition');
  }

  if (st === 'Pre-revenue / early') {
    add('Angel & early-stage networks', 'Individual and syndicate investors backing early-stage businesses.', '$100k – $2m', 'Early-stage business');
    add('Impact & blended finance', 'Investors targeting measurable impact alongside financial return.', '$1m – $25m', 'Early-stage business');
  }
  if (st === 'Revenue-generating') {
    add('Growth capital funds', 'Dedicated growth investors funding expansion without requiring control.', '$3m – $25m', 'Revenue-generating');
    add('Family offices', 'Patient private capital with flexible structures and longer horizons.', '$1m – $20m', 'Revenue-generating');
  }
  if (st === 'Profitable & scaling') {
    add('Private equity', 'Control and co-control investors with sector theses and operational capability.', '$5m – $50m', 'Profitable & scaling');
    add('Mezzanine & structured capital', 'Subordinated debt and hybrid capital sitting between senior debt and equity.', '$5m – $30m', 'Profitable & scaling');
  }
  if (st === 'Mature / established') {
    add('Sovereign & institutional capital', 'Large-ticket institutional allocators and sovereign investors.', '$25m+', 'Mature business');
    add('Private equity', 'Control and co-control investors with sector theses and operational capability.', '$5m – $50m', 'Mature business');
  }

  cats.sort((x, y) => y.reasons.length - x.reasons.length);
  return cats.slice(0, 5);
}

/* ============================================================
   PRIMITIVES
   ============================================================ */
function Micro({ children, className = '', tone = 'dark' }) {
  return (
    <span className={`micro ${tone === 'light' ? 'text-white/45' : 'text-[#0C1014]/45'} ${className}`}>
      {children}
    </span>
  );
}

function Btn({ children, onClick, variant = 'primary', size = 'md', className = '', type = 'button', disabled }) {
  const base = 'inline-flex items-center justify-center gap-2.5 transition-all duration-200 tracking-wide disabled:opacity-30 disabled:cursor-not-allowed';
  const sizes = { sm: 'text-[12px] px-4 py-2.5', md: 'text-[13px] px-6 py-3.5', lg: 'text-[13px] px-8 py-4' };
  const variants = {
    primary: 'bg-[#0C1014] text-[#F7F5F0] hover:bg-[#B0863C]',
    brass: 'bg-[#B0863C] text-[#0C1014] hover:bg-[#D2A85F] font-medium',
    ghost: 'border border-[#0C1014]/20 text-[#0C1014] hover:border-[#0C1014] hover:bg-[#0C1014] hover:text-[#F7F5F0]',
    ghostLight: 'border border-white/25 text-[#F7F5F0] hover:bg-[#F7F5F0] hover:text-[#0C1014] hover:border-[#F7F5F0]',
    bare: 'text-[#0C1014] hover:text-[#B0863C] px-0'
  };
  return (
    <button type={type} onClick={onClick} disabled={disabled}
      className={`${base} ${sizes[size]} ${variants[variant]} ${className}`}>
      {children}
    </button>
  );
}

function Arrow({ className = '' }) {
  return (
    <svg className={className} width="14" height="10" viewBox="0 0 14 10" fill="none">
      <path d="M9 1L13 5L9 9M13 5H1" stroke="currentColor" strokeWidth="1.2" strokeLinecap="square"/>
    </svg>
  );
}

function Label({ children, hint, required }) {
  return (
    <div className="flex items-baseline justify-between gap-4 mb-2.5">
      <label className="text-[12.5px] font-medium text-[#0C1014]">
        {children}{required && <span className="text-[#B0863C] ml-1">*</span>}
      </label>
      {hint && <span className="text-[11px] text-[#0C1014]/40 text-right">{hint}</span>}
    </div>
  );
}

const inputCls = "w-full bg-white border border-[#0C1014]/15 px-4 py-3 text-[14px] text-[#0C1014] placeholder-[#0C1014]/25 transition-colors focus:border-[#B0863C] hover:border-[#0C1014]/30";

function TextInput({ value, onChange, placeholder, type = 'text' }) {
  return <input type={type} value={value || ''} onChange={e => onChange(e.target.value)} placeholder={placeholder} className={inputCls} />;
}

function TextArea({ value, onChange, placeholder, rows = 4 }) {
  return <textarea rows={rows} value={value || ''} onChange={e => onChange(e.target.value)} placeholder={placeholder} className={`${inputCls} resize-none leading-relaxed`} />;
}

function Select({ value, onChange, options, placeholder = 'Select' }) {
  return (
    <div className="relative">
      <select value={value || ''} onChange={e => onChange(e.target.value)}
        className={`${inputCls} appearance-none pr-10 cursor-pointer ${!value ? 'text-[#0C1014]/30' : ''}`}>
        <option value="">{placeholder}</option>
        {options.map(o => <option key={o} value={o} className="text-[#0C1014]">{o}</option>)}
      </select>
      <svg className="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-[#0C1014]/35" width="10" height="6" viewBox="0 0 10 6" fill="none">
        <path d="M1 1L5 5L9 1" stroke="currentColor" strokeWidth="1.2"/>
      </svg>
    </div>
  );
}

function ChipGroup({ options, value, onChange, multi = false, columns = 2 }) {
  const isOn = (o) => multi ? (value || []).includes(o) : value === o;
  const toggle = (o) => {
    if (multi) {
      const v = value || [];
      onChange(v.includes(o) ? v.filter(x => x !== o) : [...v, o]);
    } else {
      onChange(o);
    }
  };
  const cols = { 1: 'grid-cols-1', 2: 'grid-cols-1 sm:grid-cols-2', 3: 'grid-cols-1 sm:grid-cols-3' };
  return (
    <div className={`grid ${cols[columns]} gap-2`}>
      {options.map(o => {
        const label = typeof o === 'string' ? o : o.v;
        const desc = typeof o === 'string' ? null : o.d;
        const on = isOn(label);
        return (
          <button key={label} type="button" onClick={() => toggle(label)}
            className={`text-left px-4 py-3 border transition-all duration-150 ${
              on ? 'border-[#B0863C] bg-[#B0863C]/8' : 'border-[#0C1014]/12 bg-white hover:border-[#0C1014]/35'
            }`}>
            <div className="flex items-start gap-3">
              <span className={`mt-[3px] w-3.5 h-3.5 shrink-0 border flex items-center justify-center transition-colors ${
                on ? 'border-[#B0863C] bg-[#B0863C]' : 'border-[#0C1014]/25'
              }`}>
                {on && <svg width="8" height="6" viewBox="0 0 8 6" fill="none"><path d="M1 3L3 5L7 1" stroke="#0C1014" strokeWidth="1.6"/></svg>}
              </span>
              <span className="min-w-0">
                <span className={`block text-[13.5px] leading-snug ${on ? 'text-[#0C1014] font-medium' : 'text-[#0C1014]/80'}`}>{label}</span>
                {desc && <span className="block text-[11.5px] text-[#0C1014]/45 mt-1 leading-snug">{desc}</span>}
              </span>
            </div>
          </button>
        );
      })}
    </div>
  );
}

function Field({ label, hint, required, children }) {
  return (
    <div>
      <Label hint={hint} required={required}>{label}</Label>
      {children}
    </div>
  );
}

function Rule({ light }) {
  return <div className={`h-px w-full ${light ? 'bg-white/12' : 'bg-[#0C1014]/12'}`} />;
}

function SectionHead({ index, eyebrow, title, sub, light, className = '' }) {
  return (
    <div className={className}>
      {(index || eyebrow) && (
        <div className="flex items-center gap-4 mb-5">
          {index && <span className="serif text-[15px] text-[#B0863C]">{index}</span>}
          {index && <span className={`h-px w-8 ${light ? 'bg-white/20' : 'bg-[#0C1014]/15'}`} />}
          {eyebrow && <Micro tone={light ? 'light' : 'dark'}>{eyebrow}</Micro>}
        </div>
      )}
      <h2 className={`serif text-[clamp(1.75rem,4vw,2.75rem)] leading-[1.1] ${light ? 'text-[#F7F5F0]' : 'text-[#0C1014]'}`}>
        {title}
      </h2>
      {sub && (
        <p className={`mt-4 text-[15px] leading-relaxed max-w-2xl ${light ? 'text-white/55' : 'text-[#0C1014]/55'}`}>
          {sub}
        </p>
      )}
    </div>
  );
}

/* ============================================================
   NAV
   ============================================================ */
const NAV_LINKS = [
  ['businesses', '01', 'For Businesses'],
  ['investors', '02', 'For Investors'],
  ['network', '03', 'Capital Network'],
  ['how', '04', 'How It Works'],
  ['opportunities', '05', 'Opportunities'],
  ['insights', '06', 'Insights'],
  ['about', '07', 'About'],
];

function Nav({ route, go }) {
  const [open, setOpen] = useState(false);
  const [scrolled, setScrolled] = useState(false);

  useEffect(() => {
    const h = () => setScrolled(window.scrollY > 12);
    window.addEventListener('scroll', h);
    return () => window.removeEventListener('scroll', h);
  }, []);

  const nav = (r) => { setOpen(false); go(r); };

  return (
    <header className={`sticky top-0 z-50 transition-all duration-300 ${
      scrolled ? 'bg-[#F7F5F0]/95 backdrop-blur-md border-b border-[#0C1014]/10' : 'bg-[#F7F5F0] border-b border-transparent'
    }`}>
      <div className="max-w-[1320px] mx-auto px-6 lg:px-10">
        <div className="flex items-center justify-between h-[70px]">
          <button onClick={() => nav('home')} className="flex items-center gap-3 group">
            <span className="w-8 h-8 border border-[#0C1014] flex items-center justify-center serif text-[13px] text-[#0C1014] group-hover:bg-[#0C1014] group-hover:text-[#F7F5F0] transition-colors">
              ML
            </span>
            <span className="hidden sm:block text-left leading-none">
              <span className="block text-[13px] font-medium tracking-[0.12em] text-[#0C1014]">ML GATEWAY</span>
              <span className="block micro text-[#0C1014]/40 mt-1">Private Capital Access</span>
            </span>
          </button>

          <nav className="hidden lg:flex items-center gap-7">
            {NAV_LINKS.map(([r, n, label]) => (
              <button key={r} onClick={() => nav(r)}
                className={`text-[12.5px] tracking-wide transition-colors relative py-1 ${
                  route === r ? 'text-[#0C1014]' : 'text-[#0C1014]/50 hover:text-[#0C1014]'
                }`}>
                {label}
                {route === r && <span className="absolute -bottom-0.5 left-0 right-0 h-px bg-[#B0863C]" />}
              </button>
            ))}
          </nav>

          <div className="flex items-center gap-3">
            <Btn size="sm" onClick={() => nav('fit')} className="hidden sm:inline-flex">
              Find your pathway <Arrow />
            </Btn>
            <button onClick={() => setOpen(!open)} className="lg:hidden w-9 h-9 flex flex-col items-center justify-center gap-[5px]">
              <span className={`block w-5 h-px bg-[#0C1014] transition-transform ${open ? 'rotate-45 translate-y-[3px]' : ''}`} />
              <span className={`block w-5 h-px bg-[#0C1014] transition-transform ${open ? '-rotate-45 -translate-y-[3px]' : ''}`} />
            </button>
          </div>
        </div>
      </div>

      {open && (
        <div className="lg:hidden border-t border-[#0C1014]/10 bg-[#F7F5F0] fadein-s">
          <div className="px-6 py-4">
            {NAV_LINKS.map(([r, n, label]) => (
              <button key={r} onClick={() => nav(r)}
                className="w-full flex items-center gap-4 py-3.5 border-b border-[#0C1014]/8 last:border-0 text-left">
                <span className="serif text-[13px] text-[#B0863C] w-6">{n}</span>
                <span className={`text-[14px] ${route === r ? 'text-[#0C1014]' : 'text-[#0C1014]/60'}`}>{label}</span>
              </button>
            ))}
            <Btn size="sm" onClick={() => nav('fit')} className="w-full mt-4">Find your pathway <Arrow /></Btn>
          </div>
        </div>
      )}
    </header>
  );
}

/* ============================================================
   FOOTER
   ============================================================ */
function Footer({ go }) {
  return (
    <footer className="bg-[#0C1014] text-[#F7F5F0]">
      <div className="max-w-[1320px] mx-auto px-6 lg:px-10 py-16 lg:py-20">
        <div className="grid lg:grid-cols-[1.4fr_1fr_1fr_1fr] gap-12 lg:gap-10">
          <div>
            <div className="flex items-center gap-3 mb-6">
              <span className="w-8 h-8 border border-white/25 flex items-center justify-center serif text-[13px]">ML</span>
              <span className="text-[13px] font-medium tracking-[0.12em]">ML GATEWAY</span>
            </div>
            <p className="text-[14px] leading-relaxed text-white/50 max-w-xs">
              Curated private capital access. We match investment- and growth-ready businesses with investors aligned to mandate, sector, stage and geography.
            </p>
          </div>

          <div>
            <Micro tone="light" className="block mb-5">Platform</Micro>
            <div className="space-y-3">
              {[['businesses', 'Access Private Capital'], ['investors', 'Investment Opportunities'],
                ['network', 'Join the Capital Network'], ['fit', 'Find Your Capital Pathway']].map(([r, l]) => (
                <button key={r} onClick={() => go(r)} className="block text-[13.5px] text-white/60 hover:text-[#D2A85F] transition-colors">{l}</button>
              ))}
            </div>
          </div>

          <div>
            <Micro tone="light" className="block mb-5">Architecture</Micro>
            <div className="space-y-3">
              {NAV_LINKS.slice(3).map(([r, n, l]) => (
                <button key={r} onClick={() => go(r)} className="flex items-center gap-3 text-[13.5px] text-white/60 hover:text-[#D2A85F] transition-colors">
                  <span className="serif text-[11px] text-white/25">{n}</span>{l}
                </button>
              ))}
            </div>
          </div>

          <div>
            <Micro tone="light" className="block mb-5">Contact</Micro>
            <div className="space-y-3 text-[13.5px] text-white/60">
              <p>opportunities@mlgateway.com</p>
              <p>mandates@mlgateway.com</p>
            </div>

const FIT_QUESTIONS = [

  { key: 'amount', q: 'How much capital are you seeking?', type: 'chips', options: AMOUNTS, cols: 3 },

  { key: 'purpose', q: 'What will the capital be used for?', type: 'chips', options: PURPOSES, cols: 3, multi: true },
];

function CapitalFit({ go, onComplete }) {
  const [step, setStep] = useState(0);
  const [answers, setAnswers] = useState({});
  const [done, setDone] = useState(false);

  const total = FIT_QUESTIONS.length;
  const current = FIT_QUESTIONS[step];
  const value = answers[current?.key];
  const canAdvance = current?.multi ? (value || []).length > 0 : !!value;

  const set = (v) => setAnswers({ ...answers, [current.key]: v });

  const next = () => {
    if (step < total - 1) setStep(step + 1);
    else setDone(true);
  };
  const back = () => { if (step > 0) setStep(step - 1); };

  const matches = useMemo(() => (done ? computeFit(answers) : []), [done, answers]);

  useEffect(() => { window.scrollTo(0, 0); }, [step, done]);

  if (done) {
    return (
      <div className="fadein">
        <section className="max-w-[1320px] mx-auto px-6 lg:px-10 py-14 lg:py-20">
          <div className="grid lg:grid-cols-[1.35fr_1fr] gap-12 lg:gap-16">

                Your opportunity may be suited to{' '}
                <span className="italic text-[#B0863C]">{matches.length} {matches.length === 1 ? 'category' : 'categories'}</span>{' '}
                of private capital.
              </h1>
              <p className="text-[15px] leading-relaxed text-[#0C1014]/55 max-w-2xl mb-12">
                This is an indicative read based on what you have told us — not a commitment or an offer. A submission is reviewed against live investor mandates before anything is shared.
              </p>

              <div className="space-y-px bg-[#0C1014]/10">
                {matches.map((m, i) => (
                  <div key={m.name} className="bg-[#F7F5F0] p-6 lg:p-7">
                    <div className="flex items-start justify-between gap-6 mb-3">
                      <div className="flex items-baseline gap-4">
                        <span className="serif text-[13px] text-[#B0863C]">{String(i + 1).padStart(2, '0')}</span>
                        <h3 className="serif text-[22px] lg:text-[25px] text-[#0C1014] leading-tight">{m.name}</h3>

                      <span className="hidden sm:block text-[11.5px] text-[#0C1014]/40 whitespace-nowrap pt-1.5">{m.ticket}</span>

                    <div className="flex flex-wrap gap-2 lg:pl-8">

                          {r}
                        </span>
                      ))}
                      <span className="sm:hidden text-[11px] text-[#0C1014]/40 px-2.5 py-1 border border-[#0C1014]/10">{m.ticket}</span>
                    </div>
                  </div>
                ))}
              </div>

              <div className="mt-12 flex flex-wrap gap-3">

                { t: 'Introduction', d: 'Where there is fit, an introduction is made and engagement begins.' },
              ]} />
              <TermsPanel />
            </aside>
          </div>
        </section>
      </div>
    );

          <div>
            <Micro className="block mb-7">Find Your Capital Pathway</Micro>

            {/* Progress */}
            <div className="flex items-center gap-4 mb-9">
              <div className="flex-1 h-px bg-[#0C1014]/12 relative">
                <div className="absolute inset-y-0 left-0 bg-[#B0863C] transition-all duration-500"

/* ============================================================

   ============================================================ */
function App() {
  const [route, setRoute] = useState('home');
  const [fitAnswers, setFitAnswers] = useState(null);

  const go = useCallback((r) => {
    setRoute(r);
    window.scrollTo({ top: 0, behavior: 'auto' });
  }, []);

  const handleFitComplete = (answers) => {
    setFitAnswers(answers);
    go('businesses');
  };

  const view = () => {
    switch (route) {
      case 'fit': return <CapitalFit go={go} onComplete={handleFitComplete} />;
      case 'businesses': return <BusinessAccess go={go} prefill={fitAnswers} />;
      case 'investors': return <InvestorAccess go={go} />;
      case 'network': return <Network go={go} />;
      case 'how': return <HowItWorks go={go} />;
      case 'opportunities': return <Opportunities go={go} />;
      case 'insights': return <Insights go={go} />;
      case 'about': return <About go={go} />;
      default: return <Home go={go} />;
    }
  };

  return (
    <div className="min-h-screen bg-[#F7F5F0] flex flex-col">
      <Nav route={route} go={go} />
      <main className="flex-1">{view()}</main>
      <Footer go={go} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
