<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ML Gateway — Private Capital Access</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #071224;
    --navy-light: #0F203A;
    --navy-lighter: #1A2D4A;
    --yellow: #F5B722;
    --yellow-hover: #FFCA3A;
    --light: #F0F4F8;
    --white: #FFFFFF;
  }
  html { scroll-behavior: smooth; }
  body { font-family: 'Inter', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; background-color: var(--light); }
  .serif { font-family: 'Playfair Display', Georgia, serif; }
  .micro { font-size: 10.5px; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 600; }
  ::selection { background: var(--yellow); color: var(--navy); }
  input, select, textarea { font-family: 'Inter', system-ui, sans-serif; }
  input:focus, select:focus, textarea:focus { outline: none; }
  
  .fadein { animation: fadein .5s cubic-bezier(.22,.61,.36,1) both; }
  @keyframes fadein { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .fadein-s { animation: fadein .3s ease both; }
  .slide-up { animation: slideUp .4s ease both; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
  .pulse-soft { animation: pulseSoft 2s infinite ease-in-out; }
  @keyframes pulseSoft { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
  
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--navy); }
  ::-webkit-scrollbar-thumb { background: var(--yellow); border-radius: 4px; }
  
  .glass { background: rgba(15, 32, 58, 0.8); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .glow { box-shadow: 0 0 20px rgba(245, 183, 34, 0.15); }
  .glow-hover:hover { box-shadow: 0 0 30px rgba(245, 183, 34, 0.3); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect, useRef, useCallback } = React;

/* ============================================================
   BRAND TOKENS
   ============================================================ */
const C = {
  navy: '#071224',
  navyLight: '#0F203A',
  navyLighter: '#1A2D4A',
  yellow: '#F5B722',
  yellowHover: '#FFCA3A',
  light: '#F0F4F8',
  white: '#FFFFFF',
  textMuted: 'rgba(255,255,255,0.55)',
  textMutedLight: 'rgba(7,18,36,0.55)',
  borderDark: 'rgba(245,183,34,0.15)',
  borderLight: 'rgba(7,18,36,0.1)',
};

/* ============================================================
   DATA
   ============================================================ */
const SECTORS = [
  'Agriculture & agribusiness','Financial services','Healthcare & life sciences',
  'Education','Energy & renewables','Infrastructure','Technology & software',
  'Consumer & retail','Industrial & manufacturing','Logistics & transport',
  'Real estate & property','Mining & natural resources','Telecoms & media',
  'Hospitality & tourism','Water & sanitation','Other'
];

const COUNTRIES = [
  'South Africa','Kenya','Nigeria','Ghana','Egypt','Morocco','Tanzania','Uganda','Rwanda',
  'Ethiopia','Senegal','Côte d\u2019Ivoire','Zambia','Zimbabwe','Botswana','Namibia','Mozambique',
  'Mauritius','Cameroon','Tunisia','Algeria','Angola','DR Congo','Malawi','Madagascar','Seychelles',
  'Cape Verde','Gabon','Benin','Burkina Faso','Mali','Niger','Togo','Sierra Leone','Liberia',
  'Gambia','Guinea','South Sudan','Sudan','Somalia','Lesotho','Eswatini','Burundi','Chad',
  'Congo (Brazzaville)','Equatorial Guinea','Djibouti','Libya','Mauritania',
  'United Kingdom','United States','United Arab Emirates','Other'
];

const CURRENCIES = ['USD','EUR','GBP','ZAR','KES','NGN','GHS','XOF','XAF','MAD','EGP','AED','Other'];
const STAGES = ['Pre-revenue / early','Revenue-generating','Profitable & scaling','Mature / established'];
const CAPITAL_TYPES = [
  { v: 'Equity', d: 'Permanent or long-dated equity capital' },
  { v: 'Growth capital', d: 'Expansion capital without full control' },
  { v: 'Strategic capital', d: 'Capital plus strategic or operational value' },
  { v: 'Acquisition capital', d: 'Buy-outs, buy-ins, buy-and-build' },
  { v: 'Project & infrastructure capital', d: 'Asset-backed, project-financed' },
  { v: 'Other', d: 'Structured, mezzanine, revenue-based, hybrid' }
];
const AMOUNTS = ['Under $1m','$1m – $5m','$5m – $10m','$10m – $25m','$25m – $50m','$50m+'];
const GEOS = [
  { v: 'Africa', d: 'The opportunity is on the continent' },
  { v: 'Africa expansion', d: 'Existing business expanding across Africa' },
  { v: 'African acquisition', d: 'Acquiring an African business or asset' },
  { v: 'Other', d: 'Outside Africa or multi-region' }
];
const PURPOSES = [
  'Growth capital','Expansion capital','Acquisition capital','Project capital',
  'Working capital','Balance sheet strengthening','Strategic investor','Refinancing','Other'
];

/* ============================================================
   MATCH ENGINE
   ============================================================ */
function computeFit(a) {
  const cats = [];
  const add = (name, blurb, ticket, why) => {
    const ex = cats.find(c => c.name === name);
    if (ex) { if (why && !ex.reasons.includes(why)) ex.reasons.push(why); return; }
    cats.push({ name, blurb, ticket, reasons: why ? [why] : [] });
  };
  const t = a.capitalType, amt = a.amount, geo = a.geography, st = a.stage;

  if (t === 'Equity') { add('Growth equity funds', 'Funds taking minority or significant-minority positions in revenue-generating businesses.', '$3m – $25m', 'You are seeking equity capital'); add('Private equity', 'Control and co-control investors with sector theses and operational capability.', '$5m – $50m', 'Equity mandate'); }
  if (t === 'Growth capital') { add('Growth capital funds', 'Dedicated growth investors funding expansion without requiring control.', '$3m – $25m', 'Growth capital mandate'); add('Family offices', 'Patient private capital with flexible structures and longer horizons.', '$1m – $20m', 'Growth capital mandate'); }
  if (t === 'Strategic capital') { add('Strategic & corporate investors', 'Corporates investing for commercial synergy alongside financial return.', '$5m+', 'Strategic capital mandate'); add('Family offices', 'Patient private capital with flexible structures and longer horizons.', '$1m – $20m', 'Strategic capital mandate'); }
  if (t === 'Acquisition capital') { add('Acquisition & buy-and-build capital', 'Investors backing buy-outs, buy-ins and consolidation strategies.', '$5m – $100m', 'Acquisition mandate'); add('Private equity', 'Control and co-control investors with sector theses and operational capability.', '$5m – $50m', 'Acquisition mandate'); add('Mezzanine & structured capital', 'Subordinated debt and hybrid capital sitting between senior debt and equity.', '$5m – $30m', 'Acquisition mandate'); }
  if (t === 'Project & infrastructure capital') { add('Project & infrastructure capital', 'Asset-backed investors funding defined projects with contracted cash flows.', '$10m – $250m', 'Project & infrastructure mandate'); add('Development finance institutions', 'DFIs deploying long-dated capital with development mandates.', '$10m – $100m', 'Project & infrastructure mandate'); add('Sovereign & institutional capital', 'Large-ticket institutional allocators and sovereign investors.', '$25m+', 'Project & infrastructure mandate'); }
  if (t === 'Other') { add('Family offices', 'Patient private capital with flexible structures and longer horizons.', '$1m – $20m', 'Flexible / structured mandate'); add('Mezzanine & structured capital', 'Subordinated debt and hybrid capital sitting between senior debt and equity.', '$5m – $30m', 'Flexible / structured mandate'); }

  if (amt === 'Under $1m') { add('Angel & early-stage networks', 'Individual and syndicate investors backing early-stage businesses.', '$100k – $2m', 'Ticket size under $1m'); add('Revenue-based & structured finance', 'Non-dilutive capital repaid as a percentage of revenue.', '$250k – $5m', 'Ticket size under $1m'); }
  if (amt === '$1m – $5m') { add('Family offices', 'Patient private capital with flexible structures and longer horizons.', '$1m – $20m', 'Ticket size $1m – $5m'); add('Impact & blended finance', 'Investors targeting measurable impact alongside financial return.', '$1m – $25m', 'Ticket size $1m – $5m'); add('Pan-African growth funds', 'Regional funds with on-the-ground presence across African markets.', '$2m – $20m', 'Ticket size $1m – $5m'); }
  if (amt === '$5m – $10m') { add('Growth capital funds', 'Dedicated growth investors funding expansion without requiring control.', '$3m – $25m', 'Ticket size $5m – $10m'); add('Pan-African growth funds', 'Regional funds with on-the-ground presence across African markets.', '$2m – $20m', 'Ticket size $5m – $10m'); add('Regional private credit funds', 'Senior and unitranche lenders providing non-dilutive growth funding.', '$5m – $50m', 'Ticket size $5m – $10m'); }
  if (amt === '$10m – $25m') { add('Private equity', 'Control and co-control investors with sector theses and operational capability.', '$5m – $50m', 'Ticket size $10m – $25m'); add('Development finance institutions', 'DFIs deploying long-dated capital with development mandates.', '$10m – $100m', 'Ticket size $10m – $25m'); add('Mezzanine & structured capital', 'Subordinated debt and hybrid capital sitting between senior debt and equity.', '$5m – $30m', 'Ticket size $10m – $25m'); }
  if (amt === '$25m – $50m' || amt === '$50m+') { add('Sovereign & institutional capital', 'Large-ticket institutional allocators and sovereign investors.', '$25m+', 'Ticket size above $25m'); add('Development finance institutions', 'DFIs deploying long-dated capital with development mandates.', '$10m – $100m', 'Ticket size above $25m'); add('Project & infrastructure capital', 'Asset-backed investors funding defined projects with contracted cash flows.', '$10m – $250m', 'Large-ticket mandate'); }

  if (geo === 'Africa') { add('Development finance institutions', 'DFIs deploying long-dated capital with development mandates.', '$10m – $100m', 'African opportunity'); add('Impact & blended finance', 'Investors targeting measurable impact alongside financial return.', '$1m – $25m', 'African opportunity'); add('Pan-African growth funds', 'Regional funds with on-the-ground presence across African markets.', '$2m – $20m', 'African opportunity'); }
  if (geo === 'Africa expansion') { add('Pan-African growth funds', 'Regional funds with on-the-ground presence across African markets.', '$2m – $20m', 'Pan-African expansion'); add('Development finance institutions', 'DFIs deploying long-dated capital with development mandates.', '$10m – $100m', 'Pan-African expansion'); }
  if (geo === 'African acquisition') { add('Acquisition & buy-and-build capital', 'Investors backing buy-outs, buy-ins and consolidation strategies.', '$5m – $100m', 'African acquisition'); }

  if (st === 'Pre-revenue / early') { add('Angel & early-stage networks', 'Individual and syndicate investors backing early-stage businesses.', '$100k – $2m', 'Early-stage business'); add('Impact & blended finance', 'Investors targeting measurable impact alongside financial return.', '$1m – $25m', 'Early-stage business'); }
  if (st === 'Revenue-generating') { add('Growth capital funds', 'Dedicated growth investors funding expansion without requiring control.', '$3m – $25m', 'Revenue-generating'); add('Family offices', 'Patient private capital with flexible structures and longer horizons.', '$1m – $20m', 'Revenue-generating'); }
  if (st === 'Profitable & scaling') { add('Private equity', 'Control and co-control investors with sector theses and operational capability.', '$5m – $50m', 'Profitable & scaling'); add('Mezzanine & structured capital', 'Subordinated debt and hybrid capital sitting between senior debt and equity.', '$5m – $30m', 'Profitable & scaling'); }
  if (st === 'Mature / established') { add('Sovereign & institutional capital', 'Large-ticket institutional allocators and sovereign investors.', '$25m+', 'Mature business'); add('Private equity', 'Control and co-control investors with sector theses and operational capability.', '$5m – $50m', 'Mature business'); }

  cats.sort((x, y) => y.reasons.length - x.reasons.length);
  return cats.slice(0, 5);
}

/* ============================================================
   PRIMITIVES
   ============================================================ */
function Micro({ children, className = '', light = false }) {
  return <span className={`micro ${light ? 'text-[#F5B722]' : 'text-[#071224]/50'} ${className}`}>{children}</span>;
}

function Btn({ children, onClick, variant = 'primary', size = 'md', className = '', type = 'button', disabled }) {
  const base = 'inline-flex items-center justify-center gap-2.5 transition-all duration-300 tracking-wide disabled:opacity-30 disabled:cursor-not-allowed rounded-sm font-medium';
  const sizes = { sm: 'text-[12px] px-4 py-2.5', md: 'text-[13px] px-6 py-3.5', lg: 'text-[13.5px] px-8 py-4' };
  const variants = {
    primary: 'bg-[#F5B722] text-[#071224] hover:bg-[#FFCA3A] hover:shadow-[0_0_20px_rgba(245,183,34,0.3)]',
    ghost: 'border border-[#071224]/20 text-[#071224] hover:border-[#F5B722] hover:bg-[#F5B722]/5',
    ghostLight: 'border border-white/20 text-white hover:bg-[#F5B722] hover:text-[#071224] hover:border-[#F5B722]',
    navy: 'bg-[#071224] text-white hover:bg-[#0F203A]',
    bare: 'text-[#071224] hover:text-[#F5B722] px-0'
  };
  return (
    <button type={type} onClick={onClick} disabled={disabled}
      className={`${base} ${sizes[size]} ${variants[variant]} ${className}`}>
      {children}
    </button>
  );
}

function Arrow({ className = '' }) {
  return (
    <svg className={className} width="14" height="10" viewBox="0 0 14 10" fill="none">
      <path d="M9 1L13 5L9 9M13 5H1" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

function Label({ children, hint, required }) {
  return (
    <div className="flex items-baseline justify-between gap-4 mb-2.5">
      <label className="text-[12.5px] font-medium text-[#071224]">
        {children}{required && <span className="text-[#F5B722] ml-1">*</span>}
      </label>
      {hint && <span className="text-[11px] text-[#071224]/40 text-right">{hint}</span>}
    </div>
  );
}

const inputCls = "w-full bg-white border border-[#071224]/15 rounded-sm px-4 py-3 text-[14px] text-[#071224] placeholder-[#071224]/25 transition-all duration-200 focus:border-[#F5B722] focus:ring-1 focus:ring-[#F5B722]/30 hover:border-[#071224]/30";

function TextInput({ value, onChange, placeholder, type = 'text' }) {
  return <input type={type} value={value || ''} onChange={e => onChange(e.target.value)} placeholder={placeholder} className={inputCls} />;
}

function TextArea({ value, onChange, placeholder, rows = 4 }) {
  return <textarea rows={rows} value={value || ''} onChange={e => onChange(e.target.value)} placeholder={placeholder} className={`${inputCls} resize-none leading-relaxed`} />;
}

function Select({ value, onChange, options, placeholder = 'Select' }) {
  return (
    <div className="relative">
      <select value={value || ''} onChange={e => onChange(e.target.value)}
        className={`${inputCls} appearance-none pr-10 cursor-pointer ${!value ? 'text-[#071224]/30' : ''}`}>
        <option value="">{placeholder}</option>
        {options.map(o => <option key={o} value={o} className="text-[#071224]">{o}</option>)}
      </select>
      <svg className="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-[#071224]/35" width="10" height="6" viewBox="0 0 10 6" fill="none">
        <path d="M1 1L5 5L9 1" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/>
      </svg>
    </div>
  );
}

function ChipGroup({ options, value, onChange, multi = false, columns = 2 }) {
  const isOn = (o) => multi ? (value || []).includes(o) : value === o;
  const toggle = (o) => {
    if (multi) {
      const v = value || [];
      onChange(v.includes(o) ? v.filter(x => x !== o) : [...v, o]);
    } else {
      onChange(o);
    }
  };
  const cols = { 1: 'grid-cols-1', 2: 'grid-cols-1 sm:grid-cols-2', 3: 'grid-cols-1 sm:grid-cols-3' };
  return (
    <div className={`grid ${cols[columns]} gap-2.5`}>
      {options.map(o => {
        const label = typeof o === 'string' ? o : o.v;
        const desc = typeof o === 'string' ? null : o.d;
        const on = isOn(label);
        return (
          <button key={label} type="button" onClick={() => toggle(label)}
            className={`text-left px-4 py-3.5 rounded-sm border transition-all duration-200 ${
              on ? 'border-[#F5B722] bg-[#F5B722]/10 shadow-[0_0_15px_rgba(245,183,34,0.1)]' : 'border-[#071224]/12 bg-white hover:border-[#F5B722]/50 hover:bg-[#F5B722]/5'
            }`}>
            <div className="flex items-start gap-3">
              <span className={`mt-[3px] w-4 h-4 shrink-0 rounded-sm border flex items-center justify-center transition-colors ${
                on ? 'border-[#F5B722] bg-[#F5B722]' : 'border-[#071224]/25'
              }`}>
                {on && <svg width="9" height="7" viewBox="0 0 9 7" fill="none"><path d="M1 3.5L3.5 6L8 1" stroke="#071224" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>}
              </span>
              <span className="min-w-0">
                <span className={`block text-[13.5px] leading-snug ${on ? 'text-[#071224] font-medium' : 'text-[#071224]/80'}`}>{label}</span>
                {desc && <span className="block text-[11.5px] text-[#071224]/45 mt-1 leading-snug">{desc}</span>}
              </span>
            </div>
          </button>
        );
      })}
    </div>
  );
}

function Field({ label, hint, required, children }) {
  return (
    <div>
      <Label hint={hint} required={required}>{label}</Label>
      {children}
    </div>
  );
}

function SectionHead({ index, eyebrow, title, sub, light, className = '' }) {
  return (
    <div className={className}>
      {(index || eyebrow) && (
        <div className="flex items-center gap-4 mb-6">
          {index && <span className="serif text-[18px] text-[#F5B722]">{index}</span>}
          {index && <span className={`h-px w-8 ${light ? 'bg-white/20' : 'bg-[#071224]/15'}`} />}
          {eyebrow && <Micro light={light}>{eyebrow}</Micro>}
        </div>
      )}
      <h2 className={`serif text-[clamp(1.9rem,4.5vw,3rem)] leading-[1.1] ${light ? 'text-white' : 'text-[#071224]'}`}>
        {title}
      </h2>
      {sub && (
        <p className={`mt-5 text-[15.5px] leading-relaxed max-w-2xl ${light ? 'text-white/50' : 'text-[#071224]/55'}`}>
          {sub}
        </p>
      )}
    </div>
  );
}

/* ============================================================
   SMART MATCH TOOLTIP
   ============================================================ */
function SmartMatchTip({ text }) {
  const [open, setOpen] = useState(false);
  return (
    <span className="relative inline-block ml-1.5 align-middle">
      <button type="button" onMouseEnter={() => setOpen(true)} onMouseLeave={() => setOpen(false)} onClick={() => setOpen(!open)}
        className="w-4 h-4 rounded-full bg-[#F5B722]/20 text-[#F5B722] text-[10px] flex items-center justify-center font-bold hover:bg-[#F5B722]/40 transition-colors">
        ?
      </button>
      {open && (
        <span className="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 w-56 p-3 bg-[#071224] text-white text-[11.5px] leading-relaxed rounded shadow-xl z-50 fadein-s border border-[#F5B722]/20">
          {text}
          <span className="absolute top-full left-1/2 -translate-x-1/2 border-4 border-transparent border-t-[#071224]"></span>
        </span>
      )}
    </span>
  );
}

/* ============================================================
   FLOATING ASSISTANT
   ============================================================ */
function FloatingAssistant() {
  const [open, setOpen] = useState(false);
  const [msg, setMsg] = useState('');
  const [chat, setChat] = useState([
    { from: 'bot', text: 'Hello! I am the ML Gateway assistant. How can I help you navigate the platform today?' }
  ]);

  const handleSend = () => {
    if (!msg.trim()) return;
    setChat([...chat, { from: 'user', text: msg }]);
    setMsg('');
    setTimeout(() => {
      setChat(prev => [...prev, { from: 'bot', text: 'Thank you. A member of our team will follow up with you shortly. In the meantime, feel free to use the Capital Fit tool or submit an opportunity.' }]);
    }, 800);
  };

  return (
    <div className="fixed bottom-6 right-6 z-[100] flex flex-col items-end">
      {open && (
        <div className="mb-4 w-80 bg-white rounded-lg shadow-2xl border border-[#071224]/10 overflow-hidden fadein-s">
          <div className="bg-[#071224] px-5 py-4 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <span className="w-2 h-2 rounded-full bg-[#F5B722] pulse-soft"></span>
              <span className="text-[12px] font-medium text-white tracking-wide">MLG Assistant</span>
            </div>
            <button onClick={() => setOpen(false)} className="text-white/50 hover:text-white transition-colors">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M1 1L11 11M11 1L1 11" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg>
            </button>
          </div>
          <div className="h-64 overflow-y-auto p-5 space-y-4 bg-[#F0F4F8]">
            {chat.map((c, i) => (
              <div key={i} className={`flex ${c.from === 'user' ? 'justify-end' : 'justify-start'}`}>
                <div className={`max-w-[85%] px-3.5 py-2.5 rounded-lg text-[12.5px] leading-relaxed ${
                  c.from === 'user' ? 'bg-[#F5B722] text-[#071224]' : 'bg-white text-[#071224] border border-[#071224]/5'
                }`}>
                  {c.text}
                </div>
              </div>
            ))}
          </div>
          <div className="p-3 bg-white border-t border-[#071224]/5 flex gap-2">
            <input value={msg} onChange={e => setMsg(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleSend()}
              placeholder="Type a message..." className="flex-1 text-[12.5px] px-3 py-2 border border-[#071224]/10 rounded focus:border-[#F5B722] outline-none" />
            <button onClick={handleSend} className="w-8 h-8 rounded bg-[#F5B722] flex items-center justify-center hover:bg-[#FFCA3A] transition-colors">
              <Arrow className="text-[#071224]" />
            </button>
          </div>
        </div>
      )}
      <button onClick={() => setOpen(!open)}
        className="w-14 h-14 rounded-full bg-[#F5B722] shadow-[0_4px_20px_rgba(245,183,34,0.4)] flex items-center justify-center hover:scale-105 transition-transform duration-300 group">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#071224" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="group-hover:rotate-12 transition-transform">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
      </button>
    </div>
  );
}

/* ============================================================
   NAV
   ============================================================ */
const NAV_LINKS = [
  ['businesses', '01', 'For Businesses'],
  ['investors', '02', 'For Investors'],
  ['network', '03', 'Capital Network'],
  ['how', '04', 'How It Works'],
  ['opportunities', '05', 'Opportunities'],
  ['insights', '06', 'Insights'],
  ['about', '07', 'About'],
];

function Nav({ route, go }) {
  const [open, setOpen] = useState(false);
  const [scrolled, setScrolled] = useState(false);

  useEffect(() => {
    const h = () => setScrolled(window.scrollY > 10);
    window.addEventListener('scroll', h);
    return () => window.removeEventListener('scroll', h);
  }, []);

  const nav = (r) => { setOpen(false); go(r); };

const FIT_QUESTIONS = [
  { key: 'capitalType', q: 'What type of capital are you seeking?', type: 'chips', options: CAPITAL_TYPES, cols: 2 },
  { key: 'amount', q: 'How much capital are you seeking?', type: 'chips', options: AMOUNTS, cols: 3 },
  { key: 'geography', q: 'Where is the opportunity?', type: 'chips', options: GEOS, cols: 2 },
  { key: 'sector', q: 'Which sector best describes the opportunity?', type: 'chips', options: SECTORS, cols: 3 },
  { key: 'stage', q: 'What stage is the business at?', type: 'chips', options: STAGES, cols: 2 },
  { key: 'purpose', q: 'What will the capital be used for?', type: 'chips', options: PURPOSES, cols: 3, multi: true },
];

function CapitalFit({ go, onComplete }) {
  const [step, setStep] = useState(0);
  const [answers, setAnswers] = useState({});
  const [done, setDone] = useState(false);
  const [animating, setAnimating] = useState(false);

  const total = FIT_QUESTIONS.length;
  const current = FIT_QUESTIONS[step];
  const value = answers[current?.key];
  const canAdvance = current?.multi ? (value || []).length > 0 : !!value;

  const set = (v) => setAnswers({ ...answers, [current.key]: v });

  const next = () => {
    if (!canAdvance) return;
    setAnimating(true);
    setTimeout(() => {
      setAnimating(false);

/* ============================================================
   APP
   ============================================================ */
function App() {
  const [route, setRoute] = useState('home');
  const [fitAnswers, setFitAnswers] = useState(null);

  const go = useCallback((r) => {
    setRoute(r);
    window.scrollTo({ top: 0, behavior: 'auto' });
  }, []);

  const handleFitComplete = (answers) => {
    setFitAnswers(answers);
    go('businesses');
  };

  const view = () => {
    switch (route) {
      case 'fit': return <CapitalFit go={go} onComplete={handleFitComplete} />;
      case 'businesses': return <BusinessAccess go={go} prefill={fitAnswers} />;
      case 'investors': return <InvestorAccess go={go} />;
      case 'network': return <Network go={go} />;
      case 'how': return <HowItWorks go={go} />;
      case 'opportunities': return <Opportunities go={go} />;
      case 'insights': return <Insights go={go} />;
      case 'about': return <About go={go} />;
      default: return <Home go={go} />;
    }
  };

  return (
    <div className="min-h-screen bg-[#F0F4F8] flex flex-col">
      <Nav route={route} go={go} />
      <main className="flex-1">{view()}</main>
      <Footer go={go} />
      <FloatingAssistant />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
