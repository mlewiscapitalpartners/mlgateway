  .nolan-receipt{background:#fff;border:1px solid #D0D0D0;border-radius:6px;padding:26px 28px;font-family:'Inter',Arial,sans-serif;color:#222;font-size:12.5px;line-height:1.55;margin-top:10px;max-width:640px}

<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect, useCallback, useRef } = React;

/* ============================================================
   CONFIGURATION
   ============================================================ */
const ADMIN_WHATSAPP = '260762499581';

/* ML Gateway Firestore — replace with your own Firebase project.
   Until you replace these placeholder values, receipts will be generated
   and downloadable, but will not be persisted to a backend. */
const FIREBASE_CONFIG = {
  apiKey: "YOUR_ML_GATEWAY_FIREBASE_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "000000000000",
  appId: "1:000000000000:web:0000000000000000000000"
};

const VERIFY_BASE_URL = "https://mlgateway.com/verify";

const IS_FIREBASE_CONFIGURED = !!(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey.indexOf('YOUR_') !== 0);

/* Firestore init — modular SDK v12 */
let fbDb = null, FB = null;
const firebaseReady = (async function initFirebase(){
  if (!IS_FIREBASE_CONFIGURED) return null;
  try {
    const [appMod, fsMod] = await Promise.all([
      import('https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js')
    ]);
    const app = appMod.initializeApp(FIREBASE_CONFIG);
    fbDb = fsMod.getFirestore(app);
    FB = {
      doc: fsMod.doc, getDoc: fsMod.getDoc, setDoc: fsMod.setDoc,
      runTransaction: fsMod.runTransaction, serverTimestamp: fsMod.serverTimestamp
    };

/* ============================================================
   ASSESSMENT ENGINE
   ============================================================ */
function assessOpportunity(f) {
  const dims = [];
  const critical = [];
  const positives = [];
  const conditions = [];
  const flags = [];

  let p1 = 0;
  const legalMap = { 'Limited company': 4, 'Public limited company (PLC)': 4, 'Limited liability partnership (LLP)': 3, 'Partnership': 2, 'Trust': 2, 'Sole trader': 1, 'Other': 1 };
  const legalPts = legalMap[f.legalStructure] ?? 0; p1 += legalPts;
  if (legalPts >= 4) positives.push('Legal structure suitable for institutional investment');
  else if (legalPts > 0 && legalPts < 4) flags.push('Legal structure may limit certain investor types');
  const yearsMap = { 'Under 1 year': 0, '1 – 2 years': 2, '2 – 5 years': 4, '5 – 10 years': 5, 'Over 10 years': 5 };
  const yearsPts = yearsMap[f.yearsOperation] ?? 0; p1 += yearsPts;
  if (yearsPts === 0) critical.push('Trading history of less than 1 year');
  else if (yearsPts >= 4) positives.push('Established operating history');
  const taxMap = { 'Fully current': 3, 'Minor arrears, being resolved': 1, 'Significant arrears': 0, 'Not registered': 0 };
  const taxPts = taxMap[f.taxCompliance] ?? 0; p1 += taxPts;
  if (taxPts === 0) critical.push('Material tax non-compliance');
  const licMap = { 'All required licences held': 3, 'No licences required': 3, 'Applications in progress': 2, 'Required licences not held': 0 };
  const licPts = licMap[f.regulatoryLicences] ?? 0; p1 += licPts;
  if (licPts === 0) critical.push('Required regulatory licences not held');
  dims.push({ name: 'Legal & Entity Foundation', points: p1, max: 15 });

  let p2 = 0;
  const revNum = parseFloat(String(f.revenue || '').replace(/[^0-9.]/g, '')) || 0;
  let revPts = 0;
  if (revNum >= 5000000) revPts = 8; else if (revNum >= 1000000) revPts = 7; else if (revNum >= 500000) revPts = 5; else if (revNum >= 250000) revPts = 3; else if (revNum >= 100000) revPts = 1;
  p2 += revPts;
  if (revPts >= 7) positives.push('Substantial revenue base');
  else if (revPts === 0) flags.push('Limited or no revenue base');
  const trajMap = { 'Growing >20% YoY': 5, 'Growing 5–20% YoY': 4, 'Stable': 2, 'Declining': 0 };
  const trajPts = trajMap[f.revenueTrajectory] ?? 0; p2 += trajPts;
  if (f.revenueTrajectory === 'Declining') flags.push('Declining revenue trajectory');
  const ebitdaMap = { 'Profitable & growing': 6, 'Profitable & stable': 5, 'Break-even': 3, 'Loss-making, improving': 2, 'Loss-making, widening': 0 };
  const ebitdaPts = ebitdaMap[f.ebitdaPosition] ?? 0; p2 += ebitdaPts;
  if (ebitdaPts >= 5) positives.push('Demonstrated profitability');
  if (ebitdaPts === 0 && revNum < 500000) critical.push('Loss-making with widening losses at low revenue');
  const finMap = { 'Audited': 4, 'Independently reviewed': 3, 'Management accounts only': 1, 'None available': 0 };
  const finPts = finMap[f.financialStatements] ?? 0; p2 += finPts;
  if (finPts === 0) conditions.push('Provide management accounts for the last 12 months');
  else if (finPts >= 3) positives.push('Financial statements independently verified');
  const recMap = { '3 years or more': 2, '2 – 3 years': 2, '1 – 2 years': 1, 'Less than 1 year': 0 };
  p2 += recMap[f.financialHistory] ?? 0;
  dims.push({ name: 'Financial Substance', points: p2, max: 25 });

  let p3 = 0;
  const uofMap = { 'Yes — fully detailed with allocation': 8, 'Yes — outline available': 5, 'Partially defined': 2, 'Not yet defined': 0 };
  const uofPts = uofMap[f.useOfFunds] ?? 0; p3 += uofPts;
  if (uofPts === 0) critical.push('Use of funds not defined');
  else if (uofPts >= 5) positives.push('Documented use of funds');
  const capMap = { 'Fully documented and current': 5, 'Mostly documented': 3, 'Informal records': 1, 'Not documented': 0 };
  const capPts = capMap[f.capTable] ?? 0; p3 += capPts;
  if (capPts === 0) conditions.push('Prepare a clear, documented cap table before introduction');
  else if (capPts >= 4) positives.push('Clean, documented capital structure');
  const invMap = { 'Founder-owned, no external investors': 4, 'Existing investors aligned and supportive': 4, 'Existing investors passive': 3, 'Complex or misaligned shareholder base': 1 };
  p3 += invMap[f.existingInvestors] ?? 0;
  const tlMap = { 'Within 3 months': 3, '3 – 6 months': 3, '6 – 12 months': 2, '12 months +': 1, 'Flexible': 2 };
  p3 += tlMap[f.timeline] ?? 0;
  dims.push({ name: 'Capital Raise Readiness', points: p3, max: 20 });

  let p4 = 0;
  const boardMap = { 'Formal board with independent directors': 5, 'Formal board': 4, 'Advisory board only': 2, 'No formal governance': 0 };
  const boardPts = boardMap[f.governance] ?? 0; p4 += boardPts;
  if (boardPts === 0) conditions.push('Establish a formal board or advisory structure');
  else if (boardPts >= 4) positives.push('Formal governance structure');
  const shaMap = { 'Signed and current': 4, 'Signed, needs review': 2, 'Informal arrangement': 1, 'None': 0 };
  p4 += shaMap[f.shareholderAgreement] ?? 0;
  const amlMap = { 'Full KYC / AML pack ready': 3, 'Partial documentation': 2, 'Not prepared': 0 };
  const amlPts = amlMap[f.amlReadiness] ?? 0; p4 += amlPts;
  if (amlPts === 0) conditions.push('Prepare KYC / AML documentation');
  p4 += 3;
  dims.push({ name: 'Governance & Compliance', points: p4, max: 15 });

  let p5 = 0;
  const deckMap = { 'Detailed, current and investor-ready': 5, 'Outline available': 3, 'Draft in progress': 1, 'None': 0 };
  const deckPts = deckMap[f.pitchDeck] ?? 0; p5 += deckPts;
  if (deckPts === 0) conditions.push('Prepare a detailed information memorandum or pitch deck');
  else if (deckPts >= 5) positives.push('Investor-ready materials prepared');
  const modelMap = { 'Full 3-statement financial model': 6, 'Forecast model': 4, 'Simple projections': 2, 'None': 0 };
  const modelPts = modelMap[f.financialModel] ?? 0; p5 += modelPts;
  if (modelPts === 0) conditions.push('Build a financial model with scenario analysis');
  const ddMap = { 'Full data room prepared': 5, 'Partial due diligence pack': 3, 'Not prepared': 0 };
  const ddPts = ddMap[f.ddPack] ?? 0; p5 += ddPts;
  if (ddPts === 0) conditions.push('Prepare a due diligence data room');
  const mgmtMap = { 'Experienced and complete': 5, 'Experienced with identified gaps': 3, 'Founder-led only': 2, 'Key roles unfilled': 0 };
  const mgmtPts = mgmtMap[f.managementTeam] ?? 0; p5 += mgmtPts;
  if (mgmtPts >= 5) positives.push('Experienced management team');
  else if (mgmtPts === 0) conditions.push('Fill key management roles before institutional engagement');
  const kpMap = { 'Low — strong bench': 4, 'Moderate': 2, 'High — single key person': 0 };
  const kpPts = kpMap[f.keyPersonRisk] ?? 0; p5 += kpPts;
  if (kpPts === 0) flags.push('High key person concentration risk');
  dims.push({ name: 'Investment Readiness', points: p5, max: 25 });

  const total = p1 + p2 + p3 + p4 + p5;
  const pct = Math.round((total / 100) * 100);
  let decision, tier, tierLabel;
  if (critical.length > 0) { decision = 'decline'; tier = 'declined'; tierLabel = 'Not Yet Investment-Ready'; }
  else if (total >= 78) { decision = 'approve'; tier = total >= 88 ? 'investment-grade' : 'investment-ready'; tierLabel = total >= 88 ? 'Investment-Grade' : 'Investment-Ready'; }
  else if (total >= 58) { decision = 'conditional'; tier = 'growth-ready'; tierLabel = 'Growth-Ready — Conditions Apply'; }
  else { decision = 'decline'; tier = 'declined'; tierLabel = 'Not Yet Investment-Ready'; }
  const uniqueConditions = decision === 'approve' ? [] : [...new Set(conditions)];
  return { decision, tier, tierLabel, total, maxTotal: 100, pct, dims, critical, positives, conditions: uniqueConditions, flags };
}

function computeComplexity(formData, assessment) {
  const factors = [];
  const amountMap = { 'Under $1m': 4, '$1m – $5m': 9, '$5m – $10m': 14, '$10m – $25m': 19, '$25m – $50m': 22, '$50m+': 25 };
  factors.push({ key: 'Capital quantum', value: formData.amount || 'Not stated', contribution: amountMap[formData.amount] ?? 8, max: 25, note: 'Larger raises require proportionally more positioning and matching effort.' });
  const typeMap = { 'Equity': 7, 'Growth capital': 10, 'Strategic capital': 14, 'Acquisition capital': 17, 'Project & infrastructure capital': 20, 'Other': 15 };
  factors.push({ key: 'Venture structure', value: formData.capitalType || 'Not stated', contribution: typeMap[formData.capitalType] ?? 10, max: 20, note: 'Acquisition, project and structured raises involve more complex engagement.' });
  const conditionsCount = (assessment.conditions || []).length;
  const condContrib = Math.min(conditionsCount * 5, 20);
  factors.push({ key: 'Intervention required', value: conditionsCount === 0 ? 'None identified' : `${conditionsCount} condition${conditionsCount === 1 ? '' : 's'} to resolve`, contribution: condContrib, max: 20, note: 'Each condition adds intervention work to bring the opportunity to investor-ready standard.' });
  let govGaps = 0;
  if (formData.governance === 'No formal governance') govGaps += 5;
  else if (formData.governance === 'Advisory board only') govGaps += 3;
  if (formData.shareholderAgreement === 'None') govGaps += 4;
  else if (formData.shareholderAgreement === 'Informal arrangement') govGaps += 2;
  if (formData.amlReadiness === 'Not prepared') govGaps += 3;
  if (formData.amlReadiness === 'Partial documentation') govGaps += 1.5;
  if (formData.financialStatements === 'None available') govGaps += 3;
  else if (formData.financialStatements === 'Management accounts only') govGaps += 1.5;
  govGaps = Math.min(Math.round(govGaps), 15);
  const govLabel = govGaps >= 10 ? 'Material gaps' : govGaps >= 5 ? 'Moderate gaps' : govGaps > 0 ? 'Minor gaps' : 'Compliant';
  factors.push({ key: 'Governance & compliance', value: govLabel, contribution: govGaps, max: 15, note: 'Gaps in governance, shareholder documentation or AML readiness require additional engagement work.' });
  let mgmtContrib = 0, mgmtLabel = 'Not stated';
  if (formData.managementTeam === 'Key roles unfilled') { mgmtContrib = 10; mgmtLabel = 'Key roles unfilled'; }
  else if (formData.managementTeam === 'Founder-led only') { mgmtContrib = 6; mgmtLabel = 'Founder-led only'; }
  else if (formData.managementTeam === 'Experienced with identified gaps') { mgmtContrib = 3; mgmtLabel = 'Experienced with gaps'; }
  else if (formData.managementTeam === 'Experienced and complete') { mgmtContrib = 0; mgmtLabel = 'Experienced and complete'; }
  factors.push({ key: 'Management readiness', value: mgmtLabel, contribution: mgmtContrib, max: 10, note: 'Management gaps increase the positioning and support effort required.' });
  const tlMap = { 'Within 3 months': 10, '3 – 6 months': 7, '6 – 12 months': 4, '12 months +': 1, 'Flexible': 2 };
  factors.push({ key: 'Timeline urgency', value: formData.timeline || 'Not stated', contribution: tlMap[formData.timeline] ?? 3, max: 10, note: 'Compressed timelines require priority allocation and intensified matching.' });
  const score = Math.min(Math.round(factors.reduce((a, f) => a + f.contribution, 0)), 100);
  return { score, factors };
}

function computeEngagementFee(formData, assessment) {
  const geoKey = getGeographyBand(formData.country);
  const band = GEO_BANDS[geoKey];
  const complexity = computeComplexity(formData, assessment);
  const raw = band.min + (band.max - band.min) * (complexity.score / 100);
  const fee = Math.round(raw / 100) * 100;
  const clamped = Math.max(band.min, Math.min(band.max, fee));
  return { fee: clamped, band, geoKey, complexity: complexity.score, factors: complexity.factors };
}

function formatUSD(n) { return 'USD ' + n.toLocaleString('en-US'); }

function numberToWords(num){
  const ones = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const tens = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  if(num === 0) return 'Zero';
  function chunk(n){
    if(n < 20) return ones[n];
    if(n < 100) return tens[Math.floor(n/10)] + (n%10 ? ' ' + ones[n%10] : '');
    if(n < 1000) return ones[Math.floor(n/100)] + ' Hundred' + (n%100 ? ' ' + chunk(n%100) : '');
    if(n < 1000000) return chunk(Math.floor(n/1000)) + ' Thousand' + (n%1000 ? ' ' + chunk(n%1000) : '');
    return chunk(Math.floor(n/1000000)) + ' Million' + (n%1000000 ? ' ' + chunk(n%1000000) : '');
  }
  return chunk(num);
}
function amountInWords(amountStr, currency){
  const num = parseFloat(String(amountStr).replace(/[^\d.]/g, '')) || 0;
  const words = numberToWords(Math.round(num));
  if (currency === 'USD') return 'US Dollars ' + words + ' Only';
  return words + ' Kwacha Only';
}

async function generateReceiptNumber(prefix){
  const year = new Date().getFullYear();
  const pfx = prefix || 'MLG';
  const fb = await firebaseReady;
  if (fb) {
    try {
      const counterRef = FB.doc(fbDb, 'counters', 'receipts_' + pfx + '_' + year);
      const result = await FB.runTransaction(fbDb, async (tx) => {
        const snap = await tx.get(counterRef);
        const next = (snap.exists() && snap.data().value ? snap.data().value : 0) + 1;
        tx.set(counterRef, { value: next, updatedAt: FB.serverTimestamp() }, { merge: true });
        return next;
      });
      return pfx + '-' + year + '-' + String(result).padStart(6, '0');
    } catch(e) { console.warn('[MLG] Receipt counter failed:', e); }
  }
  return pfx + '-' + year + '-' + String(Math.floor(Math.random() * 900000) + 100000);
}

/* ============================================================
   PAYMENT FLOW — real, live payment system
   ============================================================ */
function PaymentFlow({
  amount,              // display amount e.g. 'K120' or 'US$10'
  currency,            // 'ZMW' or 'USD'
  purpose,             // e.g. 'Opportunity Submission & Assessment Fee'
  purposeDetail,       // e.g. 'Non-refundable. Covers platform assessment.'
  applicant,           // { firstName, lastName, email, phone, country, company }
  receiptPrefix,       // 'MLG'
  onConfirmed,         // callback when payment is confirmed & saved
  onSkip,              // optional skip
  onClose,             // for modal contexts
  compact,             // smaller layout
}) {
  const [method, setMethod] = useState(null);
  const [senderName, setSenderName] = useState('');
  const [senderContact, setSenderContact] = useState('');
  const [userRef, setUserRef] = useState('');
  const [agree, setAgree] = useState(false);
  const [errorMsg, setErrorMsg] = useState('');
  const [confirmed, setConfirmed] = useState(false);
  const [receiptNo, setReceiptNo] = useState('');
  const [receiptDate, setReceiptDate] = useState('');
  const [whatsappUrl, setWhatsappUrl] = useState('');
  const [whatsappSent, setWhatsappSent] = useState(false);
  const [copied, setCopied] = useState('');
  const [generatingPDF, setGeneratingPDF] = useState(false);
  const [checkRef, setCheckRef] = useState('');
  const [checkResult, setCheckResult] = useState('');

  const copyText = (text, key) => {
    const done = () => {
      setCopied(key);
      setTimeout(() => setCopied(''), 1500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
    } else fallbackCopy(text, done);
  };
  const fallbackCopy = (text, done) => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch(e) {}
    document.body.removeChild(ta);
  };

  const buildWhatsappMessage = (rcpt) => {
    const lines = [
      '*ML GATEWAY — PAYMENT PROOF*', '',
      '*Receipt No:* ' + rcpt,
      '*Date & Time:* ' + receiptDate,
      '', '*APPLICANT / BUSINESS*',
      'Name: ' + (applicant.firstName || '') + ' ' + (applicant.lastName || ''),
      'Company: ' + (applicant.company || '—'),
      'Email: ' + (applicant.email || '—'),
      'Phone: ' + (applicant.phone || '—'),
      'Country: ' + (applicant.country || '—'),
      '', '*PURPOSE*',
      purpose,
      '', '*PAYMENT DETAILS*',
      'Method: ' + (PAYMENT_METHODS[method] ? PAYMENT_METHODS[method].label : '—'),
      'Amount: ' + amount,
      'Sender Name: ' + senderName,
      'Sender Contact: ' + senderContact,
      'Transaction ID / Ref: ' + (userRef || '(not provided)'),
      '', '_Please verify this payment against our records and confirm receipt. A provisional receipt has been auto-generated for the applicant._'
    ];
    return lines.join('\n');
  };

  const handleConfirm = async () => {
    setErrorMsg('');
    if (!method) { setErrorMsg('Please select a payment method first.'); return; }
    if (!senderName.trim()) { setErrorMsg('Please enter the name on the payment.'); return; }
    if (!senderContact.trim()) { setErrorMsg('Please enter the phone or email used to pay.'); return; }
    if (!userRef.trim()) { setErrorMsg('Please enter your transaction reference.'); return; }
    if (!agree) { setErrorMsg('Please tick the confirmation checkbox.'); return; }

    const rcpt = await generateReceiptNumber(receiptPrefix || 'MLG');
    const now = new Date();
    const dt = now.toLocaleString('en-GB', { year:'numeric', month:'short', day:'2-digit', hour:'2-digit', minute:'2-digit' });

    setReceiptNo(rcpt);
    setReceiptDate(dt);
    const msg = buildWhatsappMessage(rcpt);
    const url = 'https://wa.me/' + ADMIN_WHATSAPP + '?text=' + encodeURIComponent(msg);
    setWhatsappUrl(url);
    setConfirmed(true);

    const m = PAYMENT_METHODS[method];
    const paymentData = {
      receiptNo: rcpt,
      receiptDate: dt,
      amount,
      currency,
      purpose,
      method: m.label,
      transactionRef: userRef,
      senderName,
      senderContact,
      applicantName: (applicant.firstName + ' ' + applicant.lastName).trim(),
      applicantEmail: applicant.email,
      applicantPhone: applicant.phone,
      applicantCountry: applicant.country,
      applicantCompany: applicant.company,
      recipientAccount: m.recipientAccount,
      status: 'pending'
    };

    const fb = await firebaseReady;
    if (fb) {
      try {
        await FB.setDoc(FB.doc(fbDb, 'receipts', rcpt), {
          ...paymentData,
          createdAt: FB.serverTimestamp()
        }, { merge: true });
      } catch(e) { console.warn('[MLG] Could not save receipt:', e); }
    }

    if (onConfirmed) onConfirmed(paymentData);

    setTimeout(() => {
      try { window.open(url, '_blank'); } catch(err) {}
    }, 350);
  };

  const downloadReceiptPDF = async () => {
    const el = document.getElementById('mlgReceipt');
    if (!el) return;
    if (typeof html2canvas === 'undefined' || typeof window.jspdf === 'undefined') {
      setErrorMsg('PDF generator not ready. Use Print instead.'); return;
    }
    setGeneratingPDF(true);
    try {
      const canvas = await html2canvas(el, { scale: 2, backgroundColor: '#ffffff', useCORS: true, logging: false });
      const imgData = canvas.toDataURL('image/png');
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ unit:'mm', format:'a4', orientation:'portrait' });
      const pdfW = pdf.internal.pageSize.getWidth();
      const pdfH = pdf.internal.pageSize.getHeight();
      const margin = 10;
      const usableW = pdfW - margin * 2;
      const ratio = canvas.height / canvas.width;
      let dispW = usableW;
      let dispH = dispW * ratio;
      if (dispH > pdfH - margin * 2) { dispH = pdfH - margin * 2; dispW = dispH / ratio; }
      const xOffset = (pdfW - dispW) / 2;
      pdf.addImage(imgData, 'PNG', xOffset, margin, dispW, dispH);
      pdf.save('MLG-Receipt-' + receiptNo + '.pdf');
    } catch(err) {
      console.error(err);
      setErrorMsg('Could not generate PDF. Try Print instead.');
    } finally {
      setGeneratingPDF(false);
    }
  };

  const printReceipt = () => {
    document.body.classList.add('print-receipt-mode');
    setTimeout(() => {
      window.print();
      setTimeout(() => document.body.classList.remove('print-receipt-mode'), 200);
    }, 100);
  };

  const lookupReceipt = async () => {
    if (!checkRef.trim()) { setCheckResult('Please enter a receipt number.'); return; }
    setCheckResult('Checking…');
    const fb = await firebaseReady;
    if (!fb) { setCheckResult('Verification service is not yet online. Contact engagements@mlgateway.com with your receipt number.'); return; }
    try {
      const snap = await FB.getDoc(FB.doc(fbDb, 'receipts', checkRef.trim().toUpperCase()));
      if (!snap.exists()) { setCheckResult('Receipt not found. Check the number, or contact engagements@mlgateway.com.'); return; }
      const data = snap.data();
      const status = (data.status || 'pending').toLowerCase();
      setCheckResult(status === 'verified' ? 'VERIFIED — your payment has been confirmed.' : 'PENDING — awaiting verification by our team.');
    } catch(e) { setCheckResult('Could not check right now. Please try again later.'); }
  };

  /* ---------- Confirmed view ---------- */
  if (confirmed) {
    const receiptData = {
      receiptNo, receiptDate, amount, currency, purpose,
      method: PAYMENT_METHODS[method].label,
      transactionRef: userRef, senderName, senderContact,
      applicantName: (applicant.firstName + ' ' + applicant.lastName).trim(),
      applicantEmail: applicant.email, applicantCountry: applicant.country,
      recipientAccount: PAYMENT_METHODS[method].recipientAccount
    };
    return (
      <div className="fadein">
        <div className="payment-success">
          <i className="fas fa-check-circle ps-icon" aria-hidden="true"></i>
          <h4>Payment Recorded</h4>
          <p>Receipt Reference: <strong>{receiptNo}</strong></p>
          <p style={{ fontSize: 12.5, color: 'rgba(7,18,36,.6)', marginTop: 6 }}>Your receipt has been generated below. Download it for your records.</p>

          <div className="ps-whatsapp-block">
            <div className="psw-title"><i className="fab fa-whatsapp" aria-hidden="true"></i> Step 1 — Send Proof to ML Gateway</div>
            <p>To confirm your payment, please send the confirmation below to our team on WhatsApp <strong>+260 762 499 581</strong>. They will compare your details against our records and confirm receipt.</p>
            <a href={whatsappUrl} className="btn-whatsapp" target="_blank" rel="noopener" onClick={() => setWhatsappSent(true)}>
              <i className="fab fa-whatsapp" aria-hidden="true"></i> <span>Send Proof to WhatsApp</span>
            </a>
            <div className="psw-note">If WhatsApp does not open automatically, tap the button above.</div>
            {whatsappSent && <div className="psw-sent show"><i className="fas fa-check-circle"></i> Confirmation ready — please tap <strong>Send</strong> in WhatsApp.</div>}
          </div>

          <div className="receipt-section">
            <div className="receipt-section-head">
              <div>
                <h5><i className="fas fa-file-invoice" style={{ color: '#8A6828', marginRight: 6 }}></i> Your Receipt</h5>
                <div className="rsh-sub">Download or print for your records</div>
              </div>
              <div className="receipt-buttons">
                <button type="button" className="receipt-btn receipt-btn-gold" onClick={downloadReceiptPDF} disabled={generatingPDF}>
                  <i className={`fas ${generatingPDF ? 'fa-spinner fa-spin' : 'fa-download'}`}></i> {generatingPDF ? 'Generating…' : 'Download PDF'}
                </button>
                <button type="button" className="receipt-btn" onClick={printReceipt}><i className="fas fa-print"></i> Print</button>
              </div>
            </div>
            <Receipt data={receiptData} id="mlgReceipt" />

            <div className="receipt-check">
              <h6><i className="fas fa-search"></i> Check receipt status later</h6>
              <div className="receipt-check-row">
                <input type="text" value={checkRef} onChange={e => setCheckRef(e.target.value)} placeholder="Enter your Receipt No (e.g. MLG-2026-000123)" />
                <button type="button" className="btn btn-primary btn-sm" onClick={lookupReceipt}>Check</button>
              </div>
              {checkResult && <div className="receipt-check-result show">{checkResult}</div>}

function FloatingAssistant() {
  const [open, setOpen] = useState(false);
  const [msg, setMsg] = useState('');
  const [chat, setChat] = useState([{ from: 'bot', text: 'Hello! I am the ML Gateway assistant. How can I help you navigate the platform today?' }]);
  const handleSend = () => {
    if (!msg.trim()) return;
    setChat([...chat, { from: 'user', text: msg }]);

  return (
    <div className="fixed bottom-6 right-6 z-[100] flex flex-col items-end">

        <div className="mb-4 w-80 bg-white rounded-lg shadow-2xl border border-[#071224]/10 overflow-hidden fadein-s">

              <span className="w-2 h-2 rounded-full bg-[#F5B722] pulse-soft"></span>
              <span className="text-[12px] font-medium text-white tracking-wide">MLG Assistant</span>
            </div>
            <button onClick={() => setOpen(false)} className="text-white/50 hover:text-white transition-colors">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M1 1L11 11M11 1L1 11" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg>
            </button>
          </div>
          <div className="h-64 overflow-y-auto p-5 space-y-4 bg-[#F0F4F8]">
            {chat.map((c, i) => (
              <div key={i} className={`flex ${c.from === 'user' ? 'justify-end' : 'justify-start'}`}>
                <div className={`max-w-[85%] px-3.5 py-2.5 rounded-lg text-[12.5px] leading-relaxed ${c.from === 'user' ? 'bg-[#F5B722] text-[#071224]' : 'bg-white text-[#071224] border border-[#071224]/5'}`}>{c.text}</div>
              </div>
            ))}
          </div>
          <div className="p-3 bg-white border-t border-[#071224]/5 flex gap-2">

          </div>
        </div>
      )}
      <button onClick={() => setOpen(!open)} className="w-14 h-14 rounded-full bg-[#F5B722] shadow-[0_4px_20px_rgba(245,183,34,0.4)] flex items-center justify-center hover:scale-105 transition-transform duration-300 group">

      </button>
    </div>
  );
}

const FIT_QUESTIONS = [
  { key: 'capitalType', q: 'What type of capital are you seeking?', options: CAPITAL_TYPES, cols: 2 },
  { key: 'amount', q: 'How much capital are you seeking?', options: AMOUNTS, cols: 3 },

  { key: 'sector', q: 'Which sector best describes the opportunity?', options: SECTORS, cols: 3 },
  { key: 'stage', q: 'What stage is the business at?', options: STAGES, cols: 2 },
  { key: 'purpose', q: 'What will the capital be used for?', options: PURPOSES, cols: 3, multi: true },
];

function CapitalFit({ go, onComplete }) {
  const [step, setStep] = useState(0);
  const [answers, setAnswers] = useState({});
  const [done, setDone] = useState(false);
  const total = FIT_QUESTIONS.length;
  const current = FIT_QUESTIONS[step];
  const value = answers[current?.key];
  const canAdvance = current?.multi ? (value || []).length > 0 : !!value;
  const set = (v) => setAnswers({ ...answers, [current.key]: v });
  const next = () => {
    if (!canAdvance) return;
    if (step < total - 1) setStep(step + 1); else setDone(true);
  };
  const back = () => { if (step > 0) setStep(step - 1); };
  useEffect(() => { window.scrollTo(0, 0); }, [step, done]);

  if (done) {
    return (
      <div className="fadein bg-[#F0F4F8]">
        <section className="max-w-[1320px] mx-auto px-6 lg:px-10 py-14 lg:py-24">

                <Micro light>Next step — Paid submission</Micro>
              </div>
              <p className="text-[14px] text-white/60 mb-5">
                Submission &amp; Assessment Fee: <strong className="text-[#F5B722]">K120 (Zambia)</strong> · <strong className="text-[#F5B722]">US$10 (rest of world)</strong>. Non-refundable. Covers the automated assessment that determines your decision.
              </p>
              <Btn variant="primary" onClick={() => onComplete(answers)}>Proceed to submission <Arrow /></Btn>

  return (
    <div className="fadein bg-[#F0F4F8] min-h-[80vh] flex items-center">
      <section className="max-w-[1320px] mx-auto px-6 lg:px-10 py-14 lg:py-20 w-full">

                <div className="h-full bg-[#F5B722] rounded-full transition-all duration-500" style={{ width: `${((step + 1) / total) * 100}%` }} />
              </div>
              <span className="text-[12px] font-medium text-[#071224]/45 tabular-nums whitespace-nowrap bg-white px-3 py-1 rounded-full border border-[#071224]/5">{String(step + 1).padStart(2, '0')} / {String(total).padStart(2, '0')}</span>

            <div className="mt-12 flex items-center gap-4">

          </div>
          <aside className="space-y-6 lg:pt-12">

            <TermsPanel />

    switch (route) {
      case 'fit': return <CapitalFit go={go} onComplete={handleFitComplete} />;
      case 'businesses': return <BusinessAccess go={go} prefill={fitAnswers} openPurchase={openPurchase} onEngagementCommenced={handleEngagementCommenced} />;
      case 'diagnostic': return <DiagnosticPage go={go} openPurchase={openPurchase} />;
      case 'investors': return <InvestorAccess go={go} />;
      case 'network': return <Network go={go} />;
      case 'how': return <HowItWorks go={go} openPurchase={openPurchase} />;
      case 'opportunities': return <Opportunities go={go} />;
      case 'insights': return <Insights go={go} />;
      case 'about': return <About go={go} />;
      default: return <Home go={go} openPurchase={openPurchase} />;
    }
  };

  return (
    <div className="min-h-screen bg-[#F0F4F8] flex flex-col">
      <Nav route={route} go={go} engagementActive={!!engagement} />
      <main className="flex-1">{view()}</main>
      <Footer go={go} />
      <FloatingAssistant />
      <PurchaseModal open={modalOpen} onClose={() => setModalOpen(false)} courtesyAmount={modalCourtesy} context={modalContext} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
